<div id="results-spp-container" class="spp-settings-wrapper">
    <div class="spp-settings">
        <div class="left-panel">
            <div class="spp-box">
                <div class="help-text">
                    <tsq>Median strategy properties computed from System Parameter Permutation profile</tsq>
                </div>
                <div id="sppStatsGrid" data-testid="results-spp-stats-grid" />
                <button ng-click="addStats()" class="btn btn-default" data-testid="results-spp-add-stats" tsq>Add stats</button>
            </div>
        </div>
        <div class="right-panel">
            <div ng-repeat="instance in instances track by $index" data-testid="results-spp-panel-{{$index}}">
                <spp-panel columns="columnsFrequency" instance="instance" class="spp-panel"></spp-panel>
            </div>
        </div>
    </div>
</div>

<items-chooser-modal instance="instanceStatsChooser" on-add="onAddStats(selectedItems)" title="Add stats" placeholder="Select stats"
    chooserLabel="Choose stats to add" multi-select="true" recent-items="true" after-init="afterChooserInit" />
