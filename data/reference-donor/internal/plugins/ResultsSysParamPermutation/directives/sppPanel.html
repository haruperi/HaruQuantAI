<div>
    <div class="sqn-input sqn-select">
        <span ng-bind="getColumnLabel()"></span>
        <select ng-model="selectedType" ng-options="item.value as item.name for item in columns" onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
            onChange="sqnSelectChange(this)" ng-change="onTypeSelect()" data-testid="results-spp-metric-select"></select>
    </div>

    <chartjs instance="chart" width="350" height="160"></chartjs>
    <span tsq>Median value</span>: <span class="median-value">{{median}}</span>
</div>
