<div class="reviewDataGrid-toolbar">
	<div style="float:left">
		<date-picker label="Skip to data" date="skipDate" on-date-change="onDateSkipChange(date)" min-date="symbolDateRangeFrom" max-date="symbolDateRangeTo" format="yyyy.mm.dd" />
		<button data-testid="dm-review-data-do-skip-btn" class="btn btn-default" type="button" ng-click="doSkip()">Skip</button>
	</div>
	
	<div style="float:right">
		<button data-testid="dm-review-data-do-edit-selected-btn" class="btn btn-default" type="button" ng-click="doEditSelected()">Edit line</button>
		<button data-testid="dm-review-data-do-delete-selected-btn" class="btn btn-default" type="button" ng-click="doDeleteSelected()">Delete line</button>
	</div>
</div>
<div class="reviewDataGrid-wrapper">
	<div id="reviewDataGrid" style="width: 100%; height: 100%;"></div>
</div>
