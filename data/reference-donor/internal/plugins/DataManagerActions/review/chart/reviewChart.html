<div class="flex-expand results-chart">
    <div ng-show="tickData" class="chart-no-tick-data" tsq>
        Chart is not available for tick data.
    </div>
    <div ng-hide="tickData" class="data-panel">
        <table>
            <tr class="chart-time">
                <td ng-bind="barData.dateTime" colspan="2"></td>
            </tr>

            <tr class="chart-price">
                <td>
                    <tsq>Open</tsq>:
                </td>
                <td ng-bind="barData.open"></td>
            </tr>
            <tr class="chart-price">
                <td>
                    <tsq>High</tsq>:
                </td>
                <td ng-bind="barData.high"></td>
            </tr>
            <tr class="chart-price">
                <td>
                    <tsq>Low</tsq>:
                </td>
                <td ng-bind="barData.low"></td>
            </tr>
            <tr class="chart-price">
                <td>
                    <tsq>Close</tsq>:
                </td>
                <td ng-bind="barData.close"></td>
            </tr>
        </table>
    </div>


    <div ng-hide="tickData" class="chart-panel" style="width: 100%;">
        <div id="canvasWrapper" ng-show="!noData" style="width: 100%!important">
            <canvas id="canvas"></canvas>
        </div>

        <p id="loadingLabel" ng-if="loading" tsq>Loading data...<p>
    </div>
</div>
