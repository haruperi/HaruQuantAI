<!-- Modal window-->
<div class="modal modal-autoheight" id="reviewDataModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document" style="width: 800px;">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
				<h4 class="modal-title" id="myModalLabel"><tsq>View data for</tsq> '{{dataDetails.symbol}}'</h4>
			</div>
			<div class="modal-body" style="height: 600px;">
				<form name="reviewDataForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}">

					<form-errors errors="errors"></form-errors>

					<fieldset class="sq-fieldset">
						<div class="row">
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Symbol name</label>
								<input data-testid="dm-review-data-symbol-input" type="text" class="sqn-input" ng-model="dataDetails.symbol" disabled />
							</div>
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Instrument</label>
								<input data-testid="dm-review-data-instrument-input" type="text" class="sqn-input" ng-model="dataDetails.instrument" disabled />
							</div>
						</div>
						<div class="row">
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Date from</label>
								<input data-testid="dm-review-data-date-from-input" type="text" class="sqn-input" ng-model="dataDetails.dateFrom" disabled />
							</div>
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Date to</label>
								<input data-testid="dm-review-data-date-to-input" type="text" class="sqn-input" ng-model="dataDetails.dateTo" disabled />
							</div>
						</div>
						<div class="row">
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Imported timeframe</label>
								<input data-testid="dm-review-data-imported-timeframe-input" type="text" class="sqn-input" ng-model="importedTimeframe" disabled />
							</div>
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Imported records</label>
								<input data-testid="dm-review-data-total-records-input" type="text" class="sqn-input" ng-model="dataDetails.totalRecords" disabled />
							</div>
						</div>

						<div class="row">
							<div class="col-sm-6">
								<label class="sqn-label" tsq>View timeframe</label>
								<div class="sqn-input sqn-select">
									<span>{{timeframe}}</span>
									<select data-testid="dm-review-data-timeframe-select" ng-model="timeframe" ng-options="item.type as item.type for item in timeframes" onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
									 ng-change="onSettingsChange()"></select>
								</div>
							</div>
							<div class="col-sm-6">
								<label class="sqn-label" tsq>Session</label>
								<div class="sqn-input sqn-select">
									<span>{{session}}</span>
									<select data-testid="dm-review-data-session-select" ng-model="session" ng-options="item.name as item.name for item in sessions" onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
									 ng-change="onSettingsChange()"></select>
								</div>
							</div>
						</div>
					</fieldset>

					<quant-tabs id="reviewTabs" instance='mainTabs' translate-headers="true" />
				</form>
			</div>
			<div class="modal-footer">
				<div ng-show="dataEditing.changed" style="color:red;float:left;" tsq>Data contains unsaved changes</div>			
				<a data-dismiss="modal" tsq>Close</a>
                <button data-testid="dm-review-data-save-btn" type="button" class="btn btn-primary" ng-click="onSave()" tsq>Save</button>
			</div>

		</div>
	</div>
</div>
