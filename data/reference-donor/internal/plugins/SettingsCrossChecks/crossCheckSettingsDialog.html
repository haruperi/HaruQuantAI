<!-- Modal window-->
<div class="modal centered" id="crossCheckSettingsModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" data-testid="crosscheck-settings-modal">
    <div class="modal-dialog" role="document" style="width: 1000px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel"><tsq>Cross check</tsq> - {{settings.title | tsq}}</h4>
            </div>
            <div class="modal-body" style="min-height: 480px;">
                <div ng-if="settings.desc" class="modal-help-box" ng-bind-html="settings.desc | tsq"></div>

                <quant-tabs id="tabs" instance='settings' translate-headers="true" data-testid="crosscheck-settings-tabs" />
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="crosscheck-settings-close" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onSaveSettings()" data-testid="crosscheck-settings-save" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
