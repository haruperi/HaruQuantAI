<div class="cross-vertical-wrapper">
  <fieldset class="sq-fieldset cross-opt-profile">
    <div class="row row-smaller">
      <div class="col-sm-3">
        <label class="sqn-label"> <tsq>Maximum tests</tsq>: </label>
      </div>
      <div class="col-sm-9">
          <div class="sqn-input sqn-select max-optimizations">
            <span>{{printMaxTestsLabel(config.maxTests)}}</span>
            <select ng-model="config.maxTests"
              ng-options="item.value as item.name for item in maxOptimizationValues"
              onFocus="sqnSelectFocus(this)"
              onBlur="sqnSelectBlur(this)"
              data-testid="crosscheck-spp-max-tests"
            ></select>
        </div>
        <br />
        <label class="sqn-label filtering-help">
          <tsq
            >you can limit the number of optimizations, and this limit the
            duration of this cross check</tsq
          >
        </label>
      </div>

      <div ng-show="config.maxTests>20000" class="max-optimisations-warning">
        {{$root.MaxOptimizationsWarning}}
      </div>
    </div>
<br>
    <div class="distribution">
      <div class="line">
        <label class="sqn-label" style="width: auto;" tsq
          >Value distribution (% from original value):</label
        >
      </div>

      <div style="margin-top: 10px">
        <label class="sqn-label" tsq>Up:</label>
        <div class="sqn-spinner">
          <input
            type="text"
            class="sqn-input"
            min="0"
            step="1"
            ng-model="config.distributionUp"
            onFocus="sqnSpinnerFocus(this)"
            onBlur="sqnSpinnerBlur(this)"
          />
          <div class="sqn-spinner-btns">
            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
          </div>
        </div>
      </div>

      <div>
        <label class="sqn-label" tsq>Down:</label>
        <div class="sqn-spinner">
          <input
            type="text"
            class="sqn-input"
            min="0"
            step="1"
            ng-model="config.distributionDown"
            onFocus="sqnSpinnerFocus(this)"
            onBlur="sqnSpinnerBlur(this)"
          />
          <div class="sqn-spinner-btns">
            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
          </div>
        </div>
      </div>

      <div>
        <label class="sqn-label" tsq>Max steps:</label>
        <div class="sqn-spinner">
          <input
            type="text"
            class="sqn-input"
            min="0"
            step="1"
            ng-model="config.steps"
            onFocus="sqnSpinnerFocus(this)"
            onBlur="sqnSpinnerBlur(this)"
          />
          <div class="sqn-spinner-btns">
            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
          </div>
        </div>
      </div>
  </div>
    
  </fieldset>

  <fieldset class="sq-fieldset">
    <legend tsq>What to parametrize</legend>

    <div class="clearfix"></div>

    <div>
      <div class="radio">
        <label class="sq-wradio">
          <a
            class="link-button pull-right"
            ng-click="$root.openlink('https://strategyquant.com/doc/recommended-optimization-parameters')"
            tsq
            >What is it?</a
          >
          <input
            type="radio"
            name="opspp-WhatToRarametrizeRadios"
            ng-model="config.parametrizeType"
            ng-value="0"
          />
          <span class="sq-mark"></span>
          <tsq>Recommended parameters</tsq>
          <div class="sq-data-help">
            <tsq
              >Only meaningful parameters. It is not a good idea to optimize
              everything</tsq
            >
            <br />
            <tsq
              >Recommended params are: periods, entry + exit settings &amp;
              multipliers</tsq
            >
          </div>
        </label>
      </div>

      <div class="radio">
        <label class="sq-wradio">
          <input
            type="radio"
            name="opspp-WhatToRarametrizeRadios"
            ng-model="config.parametrizeType"
            ng-value="1"
          />
          <span class="sq-mark"></span>
          <tsq>Your own settings</tsq>

          <div class="sq-data-help">
            <tsq>Choose your own categories</tsq>
          </div>

          <div ng-show="config.parametrizeType==1">
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.periodParams"
                  id="opspp-optimVarPeriods"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarPeriods" tsq>Periods</label>
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.constantsParams"
                  id="opspp-optimVarConstants"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarConstants" tsq>Constants</label>
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.shiftParams"
                  id="opspp-optimVarShifts"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarShifts" tsq>Shifts</label>
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.otherParams"
                  id="opspp-optimVarOtherParams"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarOtherParams" tsq>Other params</label>
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.entryParams"
                  id="opspp-optimVarEntryParams"
                />
                <label for="opspp-optimVarEntryParams" tsq
                  >Entry (levels)</label
                >
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.entryLogic"
                  id="opspp-optimVarEntryLogic"
                />
                <label for="opspp-optimVarEntryLogic" tsq>Entry (logic)</label>
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.exitParamsUsed"
                  id="opspp-optimVarExitParams"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarExitParams" tsq
                  >Exit params (SL, PT,...) only used</label
                >
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.exitParamsUnused"
                  id="opspp-optimVarExitParamsUnused"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarExitParamsUnused" tsq
                  >Exit params (SL, PT,...) unused</label
                >
              </div>
            </div>
            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.booleanParams"
                  id="opspp-optimVarBooleanParams"
                  ng-change="onChange()"
                />
                <label for="opspp-optimVarBooleanParams" tsq
                  >Boolean params</label
                >
              </div>
            </div>

            <hr />

            <div class="row row-smaller">
              <div class="sq-checkbox">
                <input
                  type="checkbox"
                  ng-model="config.symmetricVariables"
                  id="opspp-genSymVar"
                  ng-disabled="gui.symmetryDisabled"
                />
                <label for="opspp-genSymVar" tsq
                  >Symmetric variables for Long / Short</label
                >
              </div>
            </div>
          </div>
        </label>
      </div>
    </div>
  </fieldset>
</div>
