<!-- Modal Add instrument window-->
<div class="modal" id="massEditInstrumentModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width:700px; height:auto;">
        <div class="modal-content" style="width:100%; height:100%;">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel"><span ng-bind="currentAction | tsq"></span> <tsq>instrument</tsq></h4>
            </div>
            <div class="modal-body">
                <form name="addInstrumentForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}" style="text-align: left;">
                    
                    <form-errors errors="errors"></form-errors> 

					<instrument-details mass-edit="true" instrument="newInstrument" current-action="currentAction" commission-settings="!isQuantDataManager" />

                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq data-testid="dm-instruments-mass-edit-close">Close</a>
                <button type="button" class="btn btn-primary" ng-click="onMassSaveInstrument(massEditInstrumentModal)" tsq data-testid="dm-instruments-mass-edit-save">Save</button>
            </div>
        </div>
    </div>
</div>
