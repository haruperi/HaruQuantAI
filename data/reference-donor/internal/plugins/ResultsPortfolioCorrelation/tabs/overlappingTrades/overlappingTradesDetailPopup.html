<!-- Modal window-->
<div class="modal centered" id="overlappingTradesPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" data-testid="results-portfolio-correlation-overlapping-detail-close-x">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Overlapping trades</h4>
            </div>
            <div class="modal-body">
                <div>
                    <tsq>Number of overlapping trades</tsq>
                    <br/><tsq>between</tsq>
                    <b>{{symbol1}}</b> <tsq>and</tsq>
                    <b>{{symbol2}}</b>
                    <br/>
                    <br/>
                </div>

                <div id="overlapping-detail-grid" class="gridbox_compressed" style="width: 100%; min-width: 100%; height: 400px; max-width: 100%;" data-testid="results-correlation-overlapping-detail-grid"></div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="results-portfolio-correlation-overlapping-detail-close" tsq>Close</a>
            </div>
        </div>
    </div>
</div>
