<div class="simple-build-settings" ng-class="{'disabled-panel': ($root.project.state == projectStates.running || $root.project.state == projectStates.paused) && isDashboard()}" ng-show="loaded">
    <div class="disabled-area-placeholder">
        <i class="fa fa-lock" title="Setting changes locked, they will be applied next time you start the project."></i>
    </div>

    <div class="settings-summary-title" tsq>Settings summary</div>

    
    <fieldset class="sq-fieldset">
        <legend tsq>Search for portfolios using</legend>

        <div class="clearfix"></div>

        <div id="spm-searchTypeOptions">
            <div class="radio">
                <label class="sq-wradio">
                    <input type="radio" name="spmSearchType" value="bruteforce" ng-model="config.searchType" ng-change="saveConfig()"/>
                    <span class="sq-mark"></span>
                    <span tsq>Brute force</span>
                </label>
            </div>
            <div class="radio">
                <label class="sq-wradio">
                    <input type="radio" name="spmSearchType" value="genetic" ng-model="config.searchType" ng-change="saveConfig()"/>
                    <span class="sq-mark"></span>
                    <span tsq>Genetic search</span>
                </label>
            </div>
        </div>
    </fieldset>

    <label class="settings-title" style="margin-top: 0px" tsq>Databanks</label>

    <div class="setting-row">
        <label class="sqn-label fixed-width" tsq>Source databank</label>
        <div class="sqn-input sqn-select">
            <span>{{config.inputDatabank}}</span>
            <select ng-model="config.inputDatabank" ng-options="item.name as item.name for item in config.availableDatabanks" onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)" ng-change="saveConfig()"></select>
        </div>
        <div class="retest-selected pull-right">
            <div class="sq-checkbox">
                <input type="checkbox" id="spm-only-selected" ng-model="config.onlySelected" ng-change="saveConfig()" />
                <label class="sqn-label" for="spm-only-selected"></label>
            </div>
            <label class="sqn-label" tsq>only selected</label>
        </div>
    </div>

    <div class="setting-row" style="margin-bottom: 20px">
        <label class="sqn-label fixed-width" tsq>Target databank</label>
        <div class="sqn-input sqn-select">
            <span>{{config.outputDatabank}}</span>
            <select ng-model="config.outputDatabank" ng-options="item.name as item.name for item in config.availableDatabanks" onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)" ng-change="saveConfig()"></select>
        </div>
    </div>

    
    <label class="settings-title" style="margin-top: 0px" tsq>Portfolio</label>

    <div class="setting-row">
        <label class="sqn-label fixed-width"><tsq># of strategies in portfolio</tsq>:</label>
        
        <label class="sqn-label mLeft60px" tsq>min</label>
        <div class="sqn-spinner pm-portfolio-min-max">
            <input type="text" class="sqn-input" min="2" step="1" max="1000000" ng-model="config.minStrategies" onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-model-options="{ updateOn : 'blur' }" ng-change="saveConfig()"/>
            <div class="sqn-spinner-btns">
                <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
            </div>
        </div>

        <label class="sqn-label" tsq>max</label>
        <div class="sqn-spinner pm-portfolio-min-max">
            <input type="text" class="sqn-input" min="0" step="1" max="1000000" ng-model="config.maxStrategies" onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-model-options="{ updateOn : 'blur' }" ng-change="saveConfig()"/>
            <div class="sqn-spinner-btns">
                <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
            </div>
        </div>
    </div>

    <div class="setting-row numberOfPossiblePortfolios">
        <label class="sqn-label"><tsq>Number of possible portfolios</tsq>:</label>
        <label class="sqn-label">{{config.numberOfPossiblePortfolios}} 
            <a class="link-button" ng-click="refreshNumberOfPossiblePortfolios()" data-testid="settings-auto-refresh"><i class="fa fa-refresh"></i></a>
        </label>
    </div>

</div>
