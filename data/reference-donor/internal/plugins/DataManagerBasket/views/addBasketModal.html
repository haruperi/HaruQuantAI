<!-- Modal Add basket window-->
<div class="modal" id="addBasketModal" data-testid="add-basket-modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width:700px; height:auto;">
        <div class="modal-content" style="width:100%; height:100%;">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel"><span ng-bind="currentAction | tsq"></span> <tsq>stocks group</tsq></h4>
            </div>
            <div class="modal-body">
                <form name="addBasketForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}" style="text-align: left;">
                    <fieldset class="sq-fieldset">
                        <form-errors errors="errors"></form-errors> 

                        <div class="row sq-data-line">
                            <div class="col-sm-3">
                                <label class="sqn-label" tsq="">Group name *</label>
                            </div>
                            <div class="col-sm-9">
                                <input type="text" class="sqn-input ng-pristine ng-untouched ng-empty ng-invalid ng-invalid-required"
                                ng-model="currentBasket.name" ng-required="true" name="Basket name" required="required" data-testid="basket-name-input">
                            </div>
                        </div>
                        <div class="row sq-data-line">
                            <div class="col-sm-3">
                                <label class="sqn-label" tsq="">Description</label>
                            </div>
                            <div class="col-sm-9">
                                <textarea ng-model="currentBasket.desc" style="height: 200px; width: 100%" class="ng-pristine ng-untouched ng-valid ng-empty" data-testid="dm-baskets-add-description"></textarea>
                            </div>
                        </div>                 
                </fieldset>                    
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq data-testid="dm-baskets-add-close">Close</a>
                <button type="button" class="btn btn-primary" ng-click="onSaveBasket(addBasketForm)" data-testid="basket-save-btn" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
