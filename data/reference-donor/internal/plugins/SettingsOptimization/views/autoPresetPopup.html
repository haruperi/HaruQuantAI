<div class="modal" id="autoPresetPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" data-testid="settings-wto-auto-preset-popup-close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>Auto preset parameters distribution</h4>
            </div>
            <div class="modal-body">
                <fieldset class="sq-fieldset optimization-tab">
                    <div class="row row-smaller">
                        <div class="col-sm-3 parameters-left">
                            <label class="sqn-label" tsq>Value distribution:</label>
                            <label class="sqn-label pull-right no-padding" tsq>Up</label>
                        </div>
                        <div class="col-sm-3 parameters-left">
                            <div class="sqn-spinner short">
                                <input type="text" class="sqn-input" min="0" step="1" max="100" ng-model="autoPreset.distributionUp"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" data-testid="settings-wto-auto-preset-popup-dist-up" />
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                            <label class="sqn-label no-padding">%</label>
                        </div>
                        <div class="col-sm-6 parameters-left">
                            <label class="sqn-label">Down</label>
                            <div class="sqn-spinner short">
                                <input type="text" class="sqn-input" min="0" step="1" max="100" ng-model="autoPreset.distributionDown"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" data-testid="settings-wto-auto-preset-popup-dist-down" />
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                            <label class="sqn-label no-padding">% from original value</label>
                        </div>
                    </div>
                    <div class="row row-smaller max-steps">
                        <div class="col-sm-3 parameters-left">
                            <label class="sqn-label" tsq>Maximum steps:</label>
                        </div>
                        <div class="col-sm-3 parameters-left">
                            <div class="sqn-spinner short">
                                <input type="text" class="sqn-input" min="2" step="1" max="10000" ng-model="autoPreset.maxSteps"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" data-testid="settings-wto-auto-preset-popup-max-steps" />
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="clearfix"></div>
                </fieldset>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button class="btn btn-primary" ng-click="onSaveAutoPreset()" data-testid="settings-wto-auto-preset-popup-save" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
