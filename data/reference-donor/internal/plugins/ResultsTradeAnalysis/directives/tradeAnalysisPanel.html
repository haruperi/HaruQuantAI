<div ng-class="{'ta-panel-noselect': !types}">
    <div ng-show="types">
        <div class="sqn-input sqn-select">
            <span ng-bind="getTypeLabel()"></span>
            <select ng-model="selectedType" ng-attr-data-testid="{{types ? 'results-trade-analysis-chart-type-' + instance.number : undefined}}" ng-options="item.type as (item.name | tsq) for item in types"
                onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)" onChange="sqnSelectChange(this)"
                ng-change="onTypeSelect()"></select>
        </div>
    </div>

    <chartjs instance="chart" width="{{::width}}" height="{{::height}}"></chartjs>
</div>
