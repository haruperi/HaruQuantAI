<div class="modal" id="newFileModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Create new</h4>
            </div>
            <div class="modal-body" style="height: 150px;">
                <form name="newFileForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}" style="text-align: left;">

                    <form-errors errors="errors"></form-errors>

                    <div class="row">
                        <div class="col-md-12">
                            <label class="sqn-label" tsq>Name</label>
                            <input type="text" class="sqn-input" ng-model="editedItem.name" data-testid="editor-nav-newfile-name" /> .
                            <span ng-hide="editedItem.createCodeFile">java</span>

                            <div ng-show="editedItem.createCodeFile" class="line" style="display: inline-flex;">
                                <sq-combo-input sq-model="editedItem.ext" options="fileExtensions" single="true" data-testid="editor-nav-newfile-ext" />
                            </div>
                        </div>
                    </div>

                    <div class="row" ng-hide="editedItem.createCodeFile || templates.length<2">
                        <div class="col-md-12">
                            <label class="sqn-label" tsq>Template</label>
                            <div class="sqn-input sqn-select">
                                <span ng-bind="getTemplateLabel()"></span>
                                <select ng-model="editedItem.template" ng-options="item.file as item.name for item in templates" onFocus="sqnSelectFocus(this)"
                                    onBlur="sqnSelectBlur(this)" data-testid="editor-nav-newfile-template"></select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Cancel</a>
                <button type="button" class="btn btn-primary" ng-click="createNewFile(newFileForm)" data-testid="editor-nav-newfile-ok" tsq>OK</button>
            </div>
        </div>
    </div>
</div>
