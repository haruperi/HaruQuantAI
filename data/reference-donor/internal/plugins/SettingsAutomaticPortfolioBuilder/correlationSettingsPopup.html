<div class="modal" id="pmCorrelationSettingsPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>Correlation settings</h4>
            </div>
            <div class="modal-body">
                <fieldset class="sq-fieldset">
                    <legend tsq>Correlation computation settings</legend>
                    <div class="clearfix"></div>
                    <label class="sqn-label" tsq>Correlation by</label>
                    <div class="sqn-input sqn-select">
                        <span ng-bind="getCorrelationPeriodLabel()"></span>
                        <select ng-model="config.correlation.period" data-testid="settings-auto-correlation-period"
                            ng-options="item.value as item.name for item in correlationPeriods"
                            onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
                            ng-change="settingsChanged()"></select>
                    </div>
                    <label class="sqn-label" tsq>of</label>
                    <div class="sqn-input sqn-select">
                        <span ng-bind="getCorrelationTypeLabel()"></span>
                        <select ng-model="config.correlation.type" data-testid="settings-auto-correlation-type"
                            ng-options="item.value as item.name for item in correlationTypes"
                            onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
                            ng-change="settingsChanged()"></select>
                    </div>
                    <label class="sqn-label" tsq>computed on</label>
                    <div class="sqn-input sqn-select">
                        <span ng-bind="getSampleTypeLabel()"></span>
                        <select ng-model="config.correlation.sampleType" data-testid="settings-auto-correlation-sample-type"
                            ng-options="item.value as item.name for item in sampleTypes"
                            onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
                            ng-change="settingsChanged()"></select>
                    </div>
                    <div class="clearfix"></div>
                    <div class="sq-checkbox"
                        ng-click="config.correlation.addEmptyPeriods=!config.correlation.addEmptyPeriods;settingsChanged()">
                        <input type="checkbox" ng-model="config.correlation.addEmptyPeriods ">
                        <label tsq>Add empty periods</label>
                    </div>
                </fieldset>

                <fieldset class="sq-fieldset">
                    <legend tsq>Filter</legend>
                    <div class="clearfix"></div>
                    <label class="sqn-label" tsq>Max allowed correlation of any two strategies in portfolio</label>
                    <div class="sqn-spinner">
                        <input type="text" class="sqn-input" min="0" step="0.1" max="1"
                            ng-model="config.correlation.max" data-testid="settings-auto-correlation-max" ng-change="settingsChanged()"
                            onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" />
                        <div class="sqn-spinner-btns">
                            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                        </div>
                    </div>
                    <div class="clearfix"></div>
                    <div class="sq-checkbox"
                        ng-click="config.correlation.allowNegative=!config.correlation.allowNegative;settingsChanged()">
                        <input type="checkbox" ng-model="config.correlation.allowNegative ">
                        <label tsq>Allow negative correlation</label>
                    </div>
                </fieldset>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
            </div>
        </div>
    </div>
</div>
