<div>
	<div class="databanks-records-count" data-testid="databank-records-count">
		<tsq>Records</tsq>:
		<span ng-bind="tab.records"></span>
		<span ng-if="tab.selectedNumber>0"> &nbsp; (
			<tsq>Selected</tsq>:
			<span ng-bind="tab.selectedNumber"></span>)
		</span>
	</div>
	
	<div class="datagrid_container">
		<div id="{{::gridId}}" data-testid="{{::gridTestid}}" class="databank-grid databank-grid-{{ tab.title | lowercase}}"
			style="width:100%;height: 100%!important"></div>
	</div>
</div>
