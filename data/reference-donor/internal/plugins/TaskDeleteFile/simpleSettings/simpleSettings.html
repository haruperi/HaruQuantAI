<div class="simple-build-settings task-delete-file">
    <label class="settings-title" tsq>Delete file</label>

    <div class="clearfix"></div>

    <div class="delete-file-line">
        <label class="sqn-label task-file-label" tsq>File</label>
        <input type="text" class="sqn-input" ng-model="config.file" readonly="1" ng-attr-title="{{config.file}}" />

    </div>
</div>
