<div class="modal" id="aboutModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" ng-click="close()" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>About</h4>
            </div>
            <div class="modal-body" style="height: 500px;">
                <div class="about">
                    <div class="licence-header product-{{product}}"></div>
                    <div class="about-text">
                        <strong>{{license.product}} {{license.version}}</strong>
                        <br>
                        &copy; Copyright StrategyQuant 2025. All rights reserved.<br>
                        <tsq>Hardware ID</tsq>: {{license.hardwareid}}<br><br>
                        <div class="about-licence" ng-show="license.code">
                            <tsq>License number</tsq>: {{license.code}} {{license.type}}<br />
                            <tsq>Licensed to</tsq>: {{license.owner}}<br />
                        </div>
                    </div>
                </div>

                <br />

                <div>
                    <button type="button" class="btn btn-primary" ng-click="verify.updateLicense = true;"
                        ng-hide="verify.updateLicense" tsq>Update license</button>
                    <div class="newLicenceText" ng-show="updatingLicenseAfterPayment" tsq>New full license was
                        created for you, please see below</div>
                    <div class="form-group update-license-form" ng-show="verify.updateLicense">
                        <label for="license" tsq>Enter license number:</label>
                        <input type="text" class="form-control license-input" ng-model="verify.code" maxlength="30"
                            size="30" />
                        <img src="../img/sq-license-progress.gif" ng-show="verify.verifyingLicense" />
                        <button type="submit" class="verify-btn" ng-click="verifyLicense()" tsq>Verify license</button>
                    </div>

                    <div ng-show="verify.updateLicense" class="license-response-text"
                        ng-class="license.updateSuccess ? 'green' : 'red'" ng-bind-html="license.updateResult | html" />
                </div>
            </div>
            <div class="modal-footer">
                <span class="about-licence-path"><tsq>Path</tsq>: {{appPath}}</span>
                <a ng-click="close()" class="btn-only-close" tsq>Close</a>
            </div>
        </div>
    </div>
</div>
