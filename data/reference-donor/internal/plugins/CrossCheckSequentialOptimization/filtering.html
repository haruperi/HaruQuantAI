<div class="crosschecks-popup-filtering sequential-cc-filtering">
  <fieldset class="sq-fieldset">
    <legend>
      <tsq>Sequential Optimization conditions</tsq
      ><a
        class="link-button pull-right"
        ng-click="onLoadDefaultSequentialOptimizationSettings()"
        tsq
        >Default settings</a
      >
    </legend>

    <div class="clearfix"></div>

    <div>
      <label class="sqn-label" tsq
        >Percentage of parameters to pass the stability test:</label
      >
      <div class="sqn-spinner">
        <input
          type="text"
          class="sqn-input"
          min="0"
          step="1"
          max="100"
          ng-model="config.pctToPass"
          onFocus="sqnSpinnerFocus(this)"
          onBlur="sqnSpinnerBlur(this)"
          ng-disabled="!config.evalProfitOptCheck"
        />
        <div class="sqn-spinner-btns">
          <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
          <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
        </div>
      </div>
      <label class="sqn-label" tsq>% to pass</label>
    </div>

    <legend>
      <tsq>Stability check</tsq>
    </legend>

    <div class="clearfix"></div>

    <div>
      <label class="sqn-label" tsq>Number of results in stable area</label>
      <div class="sqn-spinner">
        <input
          type="text"
          class="sqn-input"
          min="0"
          step="1"
          max="10000"
          ng-model="config.resultsCount"
          onFocus="sqnSpinnerFocus(this)"
          onBlur="sqnSpinnerBlur(this)"
        />
        <div class="sqn-spinner-btns">
          <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
          <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
        </div>
      </div>
    </div>

    <div>
      <label class="sqn-label" tsq>Fitness stability range</label>
      <div class="sqn-spinner">
        <input
          type="text"
          class="sqn-input"
          min="0"
          step="1"
          max="10000"
          ng-model="config.stabilityRange"
          onFocus="sqnSpinnerFocus(this)"
          onBlur="sqnSpinnerBlur(this)"
        />
        <div class="sqn-spinner-btns">
          <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
          <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
        </div>
      </div>
      <label class="sqn-label" tsq>%</label>
    </div>

    <div>
      <label class="sqn-label"></label>
      <div class="filtering-help">
        <tsq
          >Results in the stable area cannot be worse than this % from the max
          area fitness</tsq
        >
      </div>
    </div>
  </fieldset>
</div>
