<!-- Modal window -->
<div class="modal modal-onefield" id="renameResultsPluginModal" tabindex="-1" role="dialog" aria-labelledby="renameResultsPluginModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="renameResultsPluginModalLabel">
                    <tsq>Rename custom analysis</tsq> '{{pluginName}}'
                </h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                    <label class="sqn-label" id="renameResultsPluginNameInput">
                        <tsq>New name</tsq>
                        <input type="text" class="sqn-input" ng-model="newName" />
                    </label>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onRename()" tsq>Rename</button>
            </div>
        </div>
    </div>
</div>
