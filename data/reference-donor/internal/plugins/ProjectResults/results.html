<div class="results-content-container" ng-class="{'results-content-container-in-taskmanager':isTaskManager, 'br-edition': isBrazilianEdition}">
    <div class="flex-container">
        <button class="btn btn-default backToEditorBtn" ng-show="isAW || $root.activeApp == 'AlgoWizard'" ng-click="backToEditor();">&lt; Back to editor</button>
        <div class="results-info-line" ng-if="!isAW && $root.activeApp != 'AlgoWizard' && !isPortfolioComposer">
            {{(strategyName ? strategyName+" - " : "") + resultInfo}}
        </div>
        <div class="flex-expand">
            <span class="dropdown dropdown-results-tabs" id="{{resultsTabs.dropdownMenuId}}" ng-if="resultsTabs.dropdownMenu && resultsTabs.dropdownMenu.length">
                <ul class="dropdown-menu" ng-click="hideMenu()">
                    <li ng-repeat="item in resultsTabs.dropdownMenu | orderBy: '+position'" ng-dynamic-controller="item.controller">
                        <a ng-click="onClick(resultsTabs.clickedTab)">
                            <i ng-class="item.icon" aria-hidden="true" ng-if="item.icon"></i>
                            {{item.title | tsq}}
                        </a>
                    </li>
                </ul>
            </span>
            <quant-tabs id="overviewTabs" instance='resultsTabs' translate-headers="true" />
        </div>

        <div ng-if="report" id="reportGeneratingFrame" ng-include="report.templateUrl" ng-dynamic-controller="report.controller"></div>
    </div>
</div>

<div ng-include="'../../../plugins/ProjectResults/newCustomPluginModal.html'"></div>
<div ng-include="'../../../plugins/CustomResultsPluginActions/rename/renameResultsPluginPopup.html'" ng-dynamic-controller="'RenameResultsPluginPopupCtrl'"></div>
