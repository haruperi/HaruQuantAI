<div class="modal" id="addBuyHoldStrPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" data-keyboard="false">
    <div class="modal-dialog" role="document" style="width: 600px;">
        <div class="modal-content">
            <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close" data-testid="pcomposer-composition-buy-hold-close-x">
					<span aria-hidden="true">&times;</span>
				</button>
                <h4 class="modal-title" id="myModalLabel" tsq>Buy and Hold strategy</h4>
            </div>
            <div class="modal-body" style="height: 350px;">
                <div tsq>Buy and Hold: A long-term investment strategy focused on purchasing stocks/ETF and holding them to increase portfolio value over time.</div>
                <div class="pc-buy-hold-str-bold" tsq>Use only in combination with Stockpicker strategies.</div>
                <br><br>
                <div>
                    <label class="sqn-label" tsq>Symbol</label>
                    <sq-data-box sq-model="setup.symbol" class="setup-input" engine="setup.engine" id="pc-action-add-strategy-selectbox" data-testid="composition-buy-hold-symbol-select"/>
                </div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="pcomposer-composition-buy-hold-close" tsq>Close</a>
                <button id="pc-button-add-buy-hold-strategy" type="button" class="btn btn-primary" ng-click="addBuyHoldStrategySave()" data-testid="composition-buy-hold-add-btn" tsq>Add</button>
            </div>
        </div>
    </div>
</div>
