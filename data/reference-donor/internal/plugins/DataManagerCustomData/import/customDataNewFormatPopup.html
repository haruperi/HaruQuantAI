<!-- Modal Connection details window-->
<div class="modal" id="customDataNewFormatModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">New data format</h4>
            </div>
            <div class="modal-body">
                <form name="addSymbolForm" class="form-horizontal" role="form" style="text-align: left;">

                    <fieldset class="sq-fieldset">
                        <div class="sq-legend-help">Enter the name of the new data format</div>

                        <div class="row">
                            <div class="col-xs-6">
                                <label class="sqn-label">Name
                                    <input data-testid="dm-custom-data-new-format-name-input" type="text" class="sqn-input" ng-model="newFormat.name" />
                                </label>
                            </div>
                        </div>
                    </fieldset>

                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal">Close</a>
                <button data-testid="dm-custom-data-new-format-save-new-data-format-btn" type="button" class="btn btn-primary" ng-click="saveNewDataFormat()">Save</button>
            </div>
        </div>
    </div>
</div>
