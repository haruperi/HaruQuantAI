<!-- Modal window-->
<div class="modal modal-autoheight" id="customDataViewModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    <tsq>View custom data for</tsq> '{{dataDetails.name}}'
                </h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <div class="reviewCustomDataGrid-wrapper">
                    <div id="reviewCustomDataGrid" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
            </div>
        </div>
    </div>
</div>
