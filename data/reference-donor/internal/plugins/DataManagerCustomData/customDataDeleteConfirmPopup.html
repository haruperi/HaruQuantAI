<!-- Modal window-->
<div class="modal" id="customDataDeleteConfirmPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document" style="width: 600px;">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
				<h4 class="modal-title" id="myModalLabel" tsq>Delete custom data</h4>
			</div>
			<div class="modal-body">
				{{dataDeleteConfirmText | tsq}}
			</div>
			<div class="modal-footer">
				<a data-dismiss="modal" tsq>Close</a>
				<button data-testid="dm-custom-data-delete-confirm-call-action-btn" type="button" class="btn btn-primary" ng-click="callAction('clear')" tsq>Clear data</button>
				<button data-testid="dm-custom-data-delete-confirm-call-action-btn-2" type="button" class="btn btn-primary" ng-click="callAction('deleteconfirm')" tsq>Delete</button>
			</div>
		</div>
	</div>
</div>
