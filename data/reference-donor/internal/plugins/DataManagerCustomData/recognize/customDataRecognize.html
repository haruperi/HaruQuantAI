<!-- Modal window-->
<div class="modal" id="customDataRecognize" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Recognize from file</h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <form name="customDataAddForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}"
                    style="text-align: left;">

                    <form-errors errors="errors"></form-errors>
            </div>
            <div class="modal-footer">
                <button data-testid="dm-custom-data-recognize-open-help-btn" ng-click="openHelp();" class="btn btn-default sqn-btn-help" tsq>Help</button>

                <a data-dismiss="modal" tsq>Close</a>
                <button data-testid="dm-custom-data-recognize-save-btn" type="button" class="btn btn-primary" ng-click="onSave()" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
