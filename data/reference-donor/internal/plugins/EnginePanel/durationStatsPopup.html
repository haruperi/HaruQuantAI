<div class="modal" id="durationStatsModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" ng-keydown="durationStats.open = durationStats.open && $event.keyCode != 27" data-testid="projects-modal-duration">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>Total test times per elements</h4>
            </div>
            <div class="modal-body">
                <div class="help-panel" tsq>Times in the table are "serial", they
                    means how long the job was really running so you can see the time portions of every action.<br />
                    In reality jobs are running in parallel, so the real times will be shorter.</div>
                <div id="durationStatsGrid" style="width: 100%; height: 400px;"></div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" ng-click="durationStats.open = false" tsq>Close</a>
            </div>
        </div>
    </div>
</div>
