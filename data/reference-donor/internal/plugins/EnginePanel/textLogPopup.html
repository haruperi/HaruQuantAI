<div class="modal" id="textLogModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" data-testid="projects-modal-text-log">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>Text project flow</h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <a ng-click="refreshTextLog()" href="" class="pull-right" tsq>Refresh</a><br>

                <textarea ng-model="textLog" style="height: 800px"></textarea>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal">Close</a>
            </div>
        </div>
    </div>
</div>
