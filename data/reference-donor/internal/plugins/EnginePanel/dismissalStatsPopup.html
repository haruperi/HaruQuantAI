<div class="modal" id="dismissalStatsModal" data-testid="projects-modal-dismissal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" ng-keydown="dismissalStats.open = dismissalStats.open && $event.keyCode != 27">
    <div class="modal-dialog" role="document" style="width: 800px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel" tsq>Strategy dismissal stats</h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <div id="dismissalStatsGrid" style="width: 100%; height: auto;"></div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" ng-click="dismissalStats.open = false" tsq>Close</a>
            </div>
        </div>
    </div>
