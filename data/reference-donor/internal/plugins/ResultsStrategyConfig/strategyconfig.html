<div id="results-strategy-config-container" class="flex-container" data-testid="strategy-config-panel">
    <label ng-hide="strategyName" class="strategy-config-info" tsq>No strategy selected.</label>
    <label ng-show="strategyName && settings.length==0" class="strategy-config-info" tsq>Strategy doesn't contain any
        setting.</label>

    <div class="toolbar" ng-show="strategyName && !isAlgoWizardCloud && settings.length>0">
        <button class="btn btn-normal btn-default" ng-click="onApplyStrategyConfig()"
            ng-disabled="taskType == 'AutomaticRetest'" data-testid="apply-strategy-config-btn" tsq>Apply strategy config</button>
        <tsq>to</tsq>
        <div class="sqn-input sqn-select">
            <span ng-bind="getTaskLabel()"></span>
            <select ng-model="applyTo" ng-options="item.type as item.title for item in tasks"
                onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"
                ng-disabled="taskType == 'AutomaticRetest'" data-testid="apply-to-select"></select>
        </div>
    </div>

    <div class="flex-expand strategy-config-panel" ng-show="strategyName && settings.length>0">
        <div>
            <table class="ss-main-header">
                <tr>
                    <td class="key"><a ng-click="expandAll()" data-testid="results-strategy-config-expand-all" tsq>Expand all</a><a ng-click="collapseAll()" data-testid="results-strategy-config-collapse-all" tsq>Collapse all</a>
                    </td>
                    <td class="value" tsq>Strategy last test</td>
                    <td class="value" tsq>Current project config</td>
                </tr>
            </table>
            <strategy-config-list instance="list1" data-testid="results-strategy-config-list" />
        </div>
    </div>
</div>
