<!-- Modal window-->
<div class="modal modal-onefield" id="addedResourcesPopup" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width: 500px;">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel" tsq>New resources</h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <form name="newProjectForm" class="form-horizontal" role="form">
                    
                    <label class="main-label warning" tsq>Your config wasn't loaded / applied yet!</label>

                    <label class="main-label" tsq>The following new resources were created in Data manager:</label>

                    <div class="resources-table-body">
                        <div class="resources-row" ng-repeat="symbol in resources.newSymbols">
                            <div ng-bind="symbol" />
                        </div>
                    </div>

                    <div class="clearfix">
                        <br />
                        <label tsq>
                            Please go to Data manager and download data for these new symbols. <br>
                            Then reload/reapply the config again with these new data. <br>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" tsq>OK</button>
            </div>
        </div>
    </div>
</div>
