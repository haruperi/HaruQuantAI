<!-- Modal window-->
<div class="modal in centered" id="SetNoteModal" tabindex="-1" role="dialog"
    aria-labelledby="myModalLabel" data-testid="set-note-modal">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    <tsq>Set note for selected strategies</tsq>
                </h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <div class="flex-expand">
                    <div>
                        <label class="additional sqn-label" tsq>Note</label>
                        <input type="text" ng-model="config.note" ng-change="settingsChanged()" class="sqn-input" data-testid="set-note-note-input">
                    </div>                                          
                </div>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="set-note-close-btn">Close</a>
                <button type="button" class="btn btn-primary" ng-click="onSubmit()" tsq="" data-testid="set-note-ok-btn">OK</button>
            </div>
        </div>
    </div>
</div>
