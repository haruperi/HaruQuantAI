<div class="modal" id="darwinexImportModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Import data from Darwinex</h4>
            </div>
            <div class="modal-body">
                <form name="darwinexImportForm" class="form-horizontal" role="form">

                    <form-errors errors="errors"></form-errors>

                    <fieldset class="sq-fieldset">
                        <div class="td-dir-select">
                            <label class="sqn-label" tsq>Darwinex data folder</label>
                            <input data-testid="dm-darwinex-import-path-input" type="text" class="sqn-input" ng-model="config.path" readonly="1" ng-required="true" name="Darwinex data folder" />
                            <a data-testid="dm-darwinex-import-select-btn" href ng-click="onSelect();" tsq>Select</a>
                        </div>

                        <div id="darwinexImportGrid" style="height: 300px;"></div>

                        <div class="dukas-data-postfix">
                            <label tsq>Data postfix</label>
                            <div>
                                <input data-testid="dm-darwinex-import-postfix-input" type="text" class="sqn-input" ng-model="config.postfix" />
                                <label tsq>This postfix will be optionally added to the data names created</label>
                            </div>
                        </div>
                    </fieldset>

                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button data-testid="dm-darwinex-import-start-import-btn" type="button" class="btn btn-primary" ng-click="onStartImport(darwinexImportForm)" tsq>Start import</button>
            </div>
        </div>
    </div>
</div>
