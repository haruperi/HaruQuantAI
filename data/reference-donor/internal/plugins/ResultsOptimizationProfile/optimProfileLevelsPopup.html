<!-- Modal window-->
<div class="modal" id="optimProfileLevelsModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" data-testid="results-profile-levels-popup-close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Optimization profile levels</h4>
            </div>
            <div class="modal-body" style="height: auto">
                <form class="form-horizontal" role="form">
                    <fieldset class="sq-fieldset">
                        <div>
                            <div class="sq-checkbox">
                                <input type="checkbox" ng-model="config.evalProfitOptCheck" id="config.evalProfitOptCheck" data-testid="results-profile-levels-popup-profitable-check" />
                                <label for="config.evalProfitOptCheck"></label>
                            </div>
                            <label class="sqn-label" tsq>% of Profitable Optimizations</label> &gt;
                            <div class="sqn-spinner">
                                <input type="text" class="sqn-input" min="5" step="5" max="100" ng-model="config.profitOptPct"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-disabled="!config.evalProfitOptCheck" data-testid="results-profile-levels-popup-profitable-pct"/>
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="sq-checkbox">
                                <input type="checkbox" ng-model="config.evalAvgProfitCheck" id="config.evalAvgProfitCheck" data-testid="results-profile-levels-popup-avgprofit-check" />
                                <label for="config.evalAvgProfitCheck"></label>
                            </div>
                            <label class="sqn-label" tsq>Average profit (in $) of all optimizations is</label> &gt; $
                            <div class="sqn-spinner">
                                <input type="text" class="sqn-input" min="-10000" step="100" max="100000" ng-model="config.avgProfit"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-disabled="!config.evalAvgProfitCheck" data-testid="results-profile-levels-popup-avgprofit-value"/>
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="sq-checkbox">
                                <input type="checkbox" ng-model="config.evalUniformDistrCheck" id="config.evalUniformDistrCheck" data-testid="results-profile-levels-popup-uniform-check" />
                                <label for="config.evalUniformDistrCheck"></label>
                            </div>
                            <label class="sqn-label" tsq>Uniform distribution - less than</label>
                            <div class="sqn-spinner">
                                <input type="text" class="sqn-input" min="1" step="1" max="20" ng-model="config.uniformDistrChanges"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-disabled="!config.evalUniformDistrCheck" data-testid="results-profile-levels-popup-uniform-value"/>
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                            <label class="sqn-label" tsq>changes from positive to negative</label>
                        </div>

                        <div>
                            <div class="sq-checkbox">
                                <input type="checkbox" ng-model="config.evalTopProfitCheck" id="config.evalTopProfitCheck" data-testid="results-profile-levels-popup-topprofit-check" />
                                <label for="config.evalTopProfitCheck"></label>
                            </div>
                            <label class="sqn-label">Best Optimization profit</label>
                            &lt; <div class="sqn-spinner">
                                <input type="text" class="sqn-input" min="0.5" step="0.1" max="3" ng-model="config.stdevAvgProfit"
                                    onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" ng-disabled="!config.evalTopProfitCheck" data-testid="results-profile-levels-popup-topprofit-value"/>
                                <div class="sqn-spinner-btns">
                                    <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                    <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                </div>
                            </div>
                            <label class="sqn-label" tsq>StDev of average profit</label>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="results-optimization-profile-levels-popup-cancel" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="saveOptimProfileLevels()" data-testid="results-profile-levels-popup-save" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
