<!-- Modal window-->
<div class="modal modal-onefield" id="cloneSessionModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel"><tsq>Clone session</tsq> '{{config.name}}'</h4>
            </div>
            <div class="modal-body">
                <form name="cloneSessionForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}"
                    style="text-align: left;">

                    <form-errors errors="errors"></form-errors>

                    <label class="sqn-label">
                        <tsq>New session broker profile</tsq>
                        <div class="sqn-input sqn-select">
                            <span ng-bind="getBrokerProfileLabel()"></span>
                            <select ng-model="config.broker" ng-options="item.id as item.name for item in brokerProfiles" data-testid="dm-sessions-clone-broker"
                                onFocus="sqnSelectFocus(this)"
                                onBlur="sqnSelectBlur(this)" ng-change="onBrokerChange()"
                                ></select>
                        </div>    
                    </label>          

                    <label class="sqn-label">
                        <tsq>New session name</tsq>
                        <input type="text" class="sqn-input" ng-model="config.clone" data-testid="dm-sessions-clone-name" />{{brokerProfile.postfix}}
                    </label>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="dm-sessions-clone-close" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onCloneSession(cloneSessionForm)"
                    data-testid="dm-sessions-clone-save" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
