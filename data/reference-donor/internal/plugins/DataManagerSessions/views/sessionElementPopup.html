<div class="modal" id="sessionElementModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">
                    <span ng-bind="elementAction"></span>
                    <tsq>session</tsq>
                </h4>
            </div>
            <div class="modal-body">
                <form name="addAliasForm" class="form-horizontal" role="form" style="text-align: left;">
                    <fieldset class="sq-fieldset">
                        <legend tsq>Session</legend>
                        <div class="line" style="display: inline-flex; margin-top: -10px;">
                            <label class="sqn-label" tsq>Start day</label>
                            <div class="sqn-input sqn-select">
                                <span ng-bind="element.startDay"></span>
                                <select ng-model="element.startDay" ng-options="item for item in days" data-testid="dm-sessions-element-start-day" onFocus="sqnSelectFocus(this)"
                                    onBlur="sqnSelectBlur(this)" onChange="sqnSelectChange(this)"></select>
                            </div>
                            <time-spinner min="0" max="86340" step="120" sq-model="element.startTime" not-convert="true" data-testid="dm-sessions-element-start-time"></time-spinner>
                            <label class="sqn-label" tsq>End day</label>
                            <div class="sqn-input sqn-select">
                                <span ng-bind="element.endDay"></span>
                                <select ng-model="element.endDay" ng-options="item for item in days" data-testid="dm-sessions-element-end-day" onFocus="sqnSelectFocus(this)"
                                    onBlur="sqnSelectBlur(this)" onChange="sqnSelectChange(this)"></select>
                            </div>
                            <time-spinner min="0" max="86340" step="120" sq-model="element.endTime" not-convert="true" data-testid="dm-sessions-element-end-time"></time-spinner>
                        </div>
                        <div class="sq-checkbox">
                            <input type="checkbox" ng-model="element.eod" id="eodCheck" data-testid="dm-sessions-element-eod">
                            <label for="eodCheck">
                                <tsq>Session End Means EOD</tsq>
                            </label>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="dm-sessions-element-close" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onSaveElement()" data-testid="dm-sessions-element-save" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
