<!-- Modal window-->
<div class="modal" id="yahooAddModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel">Add Yahoo data</h4>
            </div>
            <div class="modal-body">
                <form class="form-horizontal" role="form">
                    <fieldset class="sq-fieldset">
                        <legend>Add data to download</legend>
                        <div class="sq-data-help">
                            <tsq>Please enter a list of stocks tickers you want to add, separated by comma, semicolon or newline.</tsq>
                            <tsq>For example: AAPL, AMZN, TSLA</tsq>
                        </div>

                        <div>
                            <textarea data-testid="dm-yahoo-add-symbols-input" ng-model="dataDetails.symbols"></textarea>
                        </div>
                    </fieldset>

                    <div class="yahoo-data-postfix">
                        <label tsq>Data postfix</label>
                        <div>
                            <input data-testid="dm-yahoo-add-postfix-input" type="text" class="sqn-input" ng-model="dataDetails.postfix" />
                            <label tsq>This postfix will be optionally added to the data names created</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal">Close</a>
                <button data-testid="dm-yahoo-add-save-btn" type="button" class="btn btn-primary" ng-click="onSave()">Save</button>
            </div>
        </div>
    </div>
</div>
