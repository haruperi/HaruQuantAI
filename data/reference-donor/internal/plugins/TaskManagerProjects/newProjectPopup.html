<!-- Modal window-->
<div class="modal modal-onefield" id="newProjectModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" data-testid="new-project-modal">
    <div class="modal-dialog" role="document">
        <div class="modal-content" style="width: 600px">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Add new project</h4>
            </div>
            <div class="modal-body">
                <form name="newProjectForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}" style="text-align: left;">

                    <form-errors errors="errors"></form-errors>

                    <label class="sqn-label"><tsq>Project name</tsq>
                        <input type="text" class="sqn-input" ng-model="project.projectName" data-testid="new-project-name-input" />
                    </label>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" data-testid="projects-modal-new-project-close" tsq>Close</a>
                <button type="button" class="btn btn-primary" ng-click="onCreateProject(newProjectForm)" data-testid="new-project-create-btn" tsq>Create</button>
            </div>
        </div>
    </div>
</div>
