<div class="clear-databanks-full-settings">
    <fieldset class="sq-fieldset sq-fieldset-select-property">
        <legend tsq>Clear selected databanks</legend>
        <div tsq>All strategies inside selected databanks will be removed.</div><br />

        <div class="row form-group" ng-repeat="databank in config.databanks track by $index">
            <div class="col-sm-12">
                <div class="sqn-input sqn-select">
                    <span ng-bind="getDatabankTitle(databank)"></span>
                    <select ng-model="databank" ng-options="item.name as item.title for item in availableDatabanks"
                        onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)" ng-change="onSave($index,databank)" data-testid="settings-clear-databanks-databank"></select>
                </div>
                <button class="sq-oos-btn-close" ng-click="onRemoveDatabank($index)" data-testid="settings-clear-databanks-remove"></button>
            </div>
        </div>

        <br>

        <button class="btn btn-default" ng-click="onAddDatabank()" tsq data-testid="settings-clear-databanks-add">Add databank</button>
        <br /> <br />
    </fieldset>
</div>
