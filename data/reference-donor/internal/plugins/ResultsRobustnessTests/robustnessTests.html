<div id="results-rt-container" class="flex-container rt-tab">
    <div class="flex-expand" ng-show="methods.length==0">
        <label id="rtLabel" tsq>Strategy doesn't have Monte Carlo tests stored.</label>
    </div>

    <div class="toolbar" ng-show="methods.length>0">
        <label>
            <tsq>Test choice</tsq>:
        </label>
        <div class="sqn-input sqn-select">
            <span ng-bind="getMethodLabel()"></span>
            <select ng-model="method" ng-options="item.value as item.name for item in methods" onFocus="sqnSelectFocus(this)"
                onBlur="sqnSelectBlur(this)" ng-change="onMethodChange()" data-testid="results-monte-carlo-method-select"></select>
        </div>
    </div>
    <div class="flex-expand monte-carlo-results" style="overflow: visible; overflow-y: visible;">
        <robustness-analysis instance='robustnessAnalysis' ng-show="methods.length>0" />
    </div>
</div>
