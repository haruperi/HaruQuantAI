<!-- Modal Add basket window-->
<div class="modal" id="editBrokerStocksModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width:700px; height:auto;">
        <div class="modal-content" style="width:100%; height:100%;">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                        aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">Edit stocks {{currentBroker.name}}</h4>
            </div>
            <div class="modal-body">
                <form name="editBrokerStocksForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}"
                    style="text-align: left;">
                    <fieldset class="sq-fieldset">
                        <form-errors errors="errors"></form-errors>
                        <div class="row">
                            <div class="col-sm-12">
                                Use the textarea below to define the individual stocks for broker, separated by
                                lines.
                                <br>
                                Example:
                                <br>
                                <pre>
AAPL
TSLA
AMZN
                                </pre>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12 text-right">
                                <button class="btn btn-default" type="button" ng-click="onImport()" data-testid="dm-brokers-edit-stocks-import">Import from file</button>
                                <button class="btn btn-default" type="button" ng-click="onExport()" data-testid="dm-brokers-edit-stocks-export">Export to file</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12 text-right">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12">
                                <textarea ng-model="currentBroker.stocks" style="height: 400px; width: 100%"
                                    data-testid="dm-brokers-edit-stocks-stocks"></textarea>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq data-testid="dm-brokers-edit-stocks-close">Close</a>
                <button type="button" class="btn btn-primary" ng-click="onEditBrokerStocks(editBrokerStocksForm)" tsq data-testid="dm-brokers-edit-stocks-save">Save</button>
            </div>
        </div>
    </div>
</div>
