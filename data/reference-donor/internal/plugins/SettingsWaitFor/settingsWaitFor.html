<fieldset class="sq-fieldset task-wait">
    <legend tsq>Wait for user/file</legend>

    <div class="clearfix"></div>

    <div class="radio">
        <label class="sq-wradio">
            <input type="radio" name="SettingsWaitTaskType" value="user" ng-model="config.action"
                ng-change="settingsChanged()" ng-class="{'checked': config.action=='user'}" data-testid="settings-wait-for-action-user" />
            <span class="sq-mark"></span>
            <tsq>Wait for user</tsq>
        </label>
    </div>

    <div class="radio">
        <label class="sq-wradio">
            <input type="radio" name="SettingsWaitTaskType" value="file" ng-model="config.action"
                ng-change="settingsChanged()" ng-class="{'checked': config.action=='file'}" data-testid="settings-wait-for-action-file" />
            <span class="sq-mark"></span>
            <tsq>Wait for file</tsq>
        </label>

        <div class="task-wait-line">
            <label class="sqn-label task-file-label" tsq>File</label>
            <input type="text" class="sqn-input" ng-model="config.file" readonly="1" ng-attr-title="{{config.file}}" data-testid="settings-wait-for-file-path" />
            <a ng-click="openFilePicker()" tsq data-testid="settings-wait-for-browse">Browse</a>
        </div>
    </div>
</fieldset>
