<!-- Modal window-->
<div class="modal centered" id="{{id}}" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content add-project-condition">
            <div class="modal-header">
                <button id="buttonTimes-35a" type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="myModalLabel" tsq>Add new condition</h4>
            </div>
            <div class="modal-body" style="height: auto;">
                <fieldset class="sq-fieldset sq-fieldset-select-property">
                    <legend tsq>Choose condition</legend>
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="sqn-input sqn-select condition-choose">
                                <span ng-bind="getConditionTitle()"></span>
                                <select ng-model="curCondition.type" ng-options="item.type as item.title for item in conditionTypes"
                                    onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)" ng-change="onSelectConditionType()"></select>
                            </div>
                        </div>
                    </div>

                </fieldset>
                <fieldset class="sq-fieldset sq-fieldset-select-property">
                    <legend tsq>Condition parameters</legend>

                    <div class="condition-param" ng-repeat="field in curCondition.fields">
                        <div class="row row-smaller" ng-if="field.type == projectConditionFields.databank">
                            <div class="col-sm-3">
                                <label class="sqn-label"><span ng-bind="field.name"></span>:</label>
                            </div>
                            <div class="col-sm-9">
                                <div class="sqn-input sqn-select">
                                    <span>{{field.value}}</span>
                                    <select ng-model="field.value" ng-options="item.name as item.name for item in databanks"
                                        onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-smaller" ng-if="field.type == projectConditionFields.comparator">
                            <div class="col-sm-3">
                                <label class="sqn-label"><span ng-bind="field.name"></span>:</label>
                            </div>
                            <div class="col-sm-9">
                                <div class="sqn-input sqn-select">
                                    <span ng-bind="getComparatorLabel(field.value)"></span>
                                    <select ng-model="field.value" ng-options="item.value as item.name for item in comparators"
                                        onFocus="sqnSelectFocus(this)" onBlur="sqnSelectBlur(this)"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-smaller" ng-if="field.type == projectConditionFields.duration" class="duration">
                            <div class="col-sm-3">
                                <label class="sqn-label"><span ng-bind="field.name"></span>:</label>
                            </div>
                            <div class="col-sm-9">
                                <div>
                                    <div class="sqn-spinner run-time">
                                        <input type="text" class="sqn-input" min="0" step="1" ng-model="field.days"
                                            onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" />
                                        <div class="sqn-spinner-btns">
                                            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                        </div>
                                    </div>
                                    <tsq>days</tsq>
                                    <div class="sqn-spinner run-time">
                                        <input type="text" class="sqn-input" min="0" step="1" max="23" ng-model="field.hours"
                                            onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" />
                                        <div class="sqn-spinner-btns">
                                            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                        </div>
                                    </div>
                                    <tsq>hours</tsq>
                                    <div class="sqn-spinner run-time">
                                        <input type="text" class="sqn-input" min="0" step="1" max="59" ng-model="field.minutes"
                                            onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" />
                                        <div class="sqn-spinner-btns">
                                            <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                            <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                        </div>
                                    </div>
                                    <tsq>minutes</tsq>
                                </div>
                            </div>
                        </div>
                        <div class="row row-smaller" ng-if="field.type == projectConditionFields.number">
                            <div class="col-sm-3">
                                <label class="sqn-label"><span ng-bind="field.name"></span>:</label>
                            </div>
                            <div class="col-sm-9">
                                <div class="sqn-spinner">
                                    <input type="text" class="sqn-input" min="0" step="1" ng-model="field.value"
                                        onFocus="sqnSpinnerFocus(this)" onBlur="sqnSpinnerBlur(this)" />
                                    <div class="sqn-spinner-btns">
                                        <div class="sqn-spinner-minus" onClick="sqnSpinnerMinus(this)"></div>
                                        <div class="sqn-spinner-plus" onClick="sqnSpinnerPlus(this)"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button id="buttonSave-35b" type="button" class="btn btn-primary" ng-click="onSaveCondition()" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
