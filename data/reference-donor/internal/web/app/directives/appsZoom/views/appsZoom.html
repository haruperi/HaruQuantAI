<span>
    <a class="zoom-out" ng-click="zoomOut()" data-toggle="tooltip" title="Zoom Out" data-testid="shell-settings-zoom-out"><i class="fa fa-search-minus" aria-hidden="true"></i></a>
    <span class="zoom-current-value" data-testid="shell-settings-zoom-value"><span ng-bind="zoomCurrentPercent"></span>%</span>
    <a class="zoom-in" ng-click="zoomIn()" data-toggle="tooltip" title="Zoom In" data-testid="shell-settings-zoom-in"><i class="fa fa-search-plus" aria-hidden="true"></i></a>
</span>
