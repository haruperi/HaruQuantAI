<!-- Modal Add instrument window-->
<div class="modal" id="{{::popupId}}" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document" style="width:700px; height:auto;">
        <div class="modal-content" style="width:100%; height:100%;">
            <div class="modal-header">
                <button id="buttonTimes-31a" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel"><span ng-bind="currentAction"></span> <tsq>instrument</tsq></h4>
            </div>
            <div class="modal-body">
                <form name="addInstrumentForm" class="form-horizontal" role="form" ng-class="{'submitted': errors}" style="text-align: left;">
                    
                    <form-errors errors="errors"></form-errors> 

					<instrument-details instrument="newInstrument" instance="newDetails" current-action="currentAction" class="instrument-details-instrument" commission-settings="true" />

                </form>
            </div>
            <div class="modal-footer">
                <a data-dismiss="modal" tsq>Close</a>
                <button id="buttonSave-31b" type="button" class="btn btn-primary" ng-click="onSaveInstrument(addInstrumentForm)" tsq>Save</button>
            </div>
        </div>
    </div>
</div>
