<div class="sq-slider" style="display: inline-flex">

    <input type="hidden" class="sq-slider-input" value="{{::sqModel}}" />
    <label ng-if="valueAlign == alignTypes.right" style="min-width: 40px!important; margin-left: 10px; margin-top: -1px;"><span ng-bind="value"/> <span ng-bind="postfix"/></label>
</div>
