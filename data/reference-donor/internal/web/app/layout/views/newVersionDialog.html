<div class="modal" id="newVersionDialog" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button id="buttonTimes-50a" type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="myModalLabel">Update</h4>
            </div>
            <div class="modal-body">
                <div class="about">
                    <div class="about-text">        
                        New version was found. Do you want to exit application and install a new version now?
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="buttonNo-50b" type="button" class="btn btn-primary" ng-click="onCloseNewVersionDialog()" tsq>No</button>
				<button id="buttonYes-50c" type="button" class="btn btn-primary" ng-click="onInstallNewVersion()" tsq>Yes</button>
            </div>
        </div>
    </div>
</div>
