<!-- Modal window-->
<div class="modal centered" id="progressModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="myModalLabel" ng-bind="progress.title | tsq"></h4>
            </div>
            <div class="modal-body">
                <label style="margin-bottom: 20px;" ng-bind="progress.info | tsq"></label>
                <div class="progress">
                    <div class="progress-bar progress-bar-striped active" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="width:{{progress.percent}}%" ng-if="progress.percent!='infinite'"> {{progress.percent}}%
                    </div>
                    <div class="progress-bar active progress-bar-infinite" role="progressbar" ng-if="progress.percent=='infinite'"></div>
                </div>
            </div>
            <div class="modal-footer">
                <a ng-show="progress.callback" ng-click="progress.callback()" class="btn-only-close" tsq>Cancel</a>
            </div>
        </div>
    </div>
</div>
