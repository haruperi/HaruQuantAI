<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <META NAME="ROBOTS" CONTENT="NOINDEX,FOLLOW">

    <title>AlgoWizard Shared Strategy</title>

    <script src="Commons-chart.js"></script>

    <script src="EquityChart.js"></script>

    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11px;
            background: #ffffff;
        }

        body.skin-dark {
            color: #bdbdbd;
            background: #3b3b3b;
        }

        #chart-wrapper {
            padding: 0;
            height: 100%;
        }

        #chart-infoline {
            padding: 8px;
        }

        #chart-infoline div {
            display: inline-block;
            width: 100%;
            padding-right: 8px;
            width: auto;
        }

        #chart-infoline br {}

        .aw-link {
            margin: 0;
            font-size: 11px;
            margin-right: 10px;
            position: relative;
            display: inline-block;
            text-decoration: underline;
            color: #3385d2;
        }

        .skin-dark .aw-link {
            color: #3394df;
        }

        .aw-link:hover {
            text-decoration: none;
        }

        #aw-link-wrapper {
            text-align: right;
            position: relative;
            top: -5px;
        }

        .text-green {
            color: #119911;
        }

        .text-red {
            color: #FF4040;
        }

        .widget-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #chart-section {
            flex: 1 0 auto;
            position: relative;
        }
    </style>

</head>

<body onresize="callresize()">

    <div class="widget-wrapper">
        <div id="chart-infoline">Loading...</div>
        <div id="chart-section">
            <div id="chart-wrapper"><canvas id="chart-small"></canvas></div>
        </div>
        <div id="aw-link-wrapper">Created by <a href="http://algowizard.io" class="aw-link" target="_blank"
                onclick="event.stopPropagation();">AlgoWizard.io</a></div>
    </div>

    <script src="small.js"></script>

</body>


</html>
