<!DOCTYPE html>

<html lang="en">

<head>
    <base href="/MTANALYZER">
    <meta charset="utf-8">
    <title>QuantAnalyzer for MetaTrader</title>
    <meta name="description" content="QuantAnalyzer for MetaTrader">
    <meta name="author" content="webmjkfm@gmail.com">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="max-age=0" />

    <script src="libs/Batch1/js/jquery-3.1.1.min.js"></script>
    <script src="libs/Batch1/js/bootstrap.min.js"></script>
    <script src="libs/Batch1/js/angular.min.js"></script>
    <script src="MTANALYZER/module.js"></script>
    <script src="MTANALYZER/service.js"></script>
    <script src="MTANALYZER/controller.js"></script>

    <link rel="stylesheet" href="common/Batch1/styles.css">
    <link rel="stylesheet" href="MTANALYZER/styles.css">
</head>

<body class="sq-main-body quant-data-manager mt-analyzer">
    <script>
        window.apps = [];
        window.appsToPreload = [];

        window.appConfig = {
            product: 'AlgoWizard',
            productName: 'QuantAnalyzer for MetaTrader',
            defaultState: 'app',
            defaultURL: '/',
            gridSkin: 'dhx_web',
            gridImagePath: '../img/dhtmlx/web/',
            code: 'MTANALYZER',
            resultTabs: ['tradeList', 'tradeAnalysis', 'overview', 'equityChart']
        };
    </script>

    <div class="sq4-wrapper">
        <div class="header" ng-app="mtqa" ng-controller="MtqaController">
            <div class="column-logo">
                <img class="logo" src="../MTANALYZER/img/qamt-logo.png">
            </div>

            <div class="column-button">
                <button id="buttonRefreshTrades-67a" type="button" class="btn btn-primary" ng-click="refreshTrades()">Refresh
                    trades</button><br>
                <a ng-click="configureOpen()">Configure</a><br>
                <span ng-bind="resultInfo"></span>
            </div>


            <div class="mtqa-banner-top">
                <img ng-show="banner" height="90" width="728" ng-src="{{banner.image}}"
                    ng-click="onBannerClicked(banner)">
            </div>

            <div ng-include="'MTANALYZER/configure.html'"></div>
        </div>

        <div class="sq4-maincontent">
            <iframe id="iframe_results" src="../RESULTS/index.html" name="sq4_mainframe" class="sq4-mainframe" />
        </div>
    </div>
</body>

</html>
