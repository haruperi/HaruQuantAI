		<meta charset="utf-8">

	Pro horní menu použít: 
	<body class="menu-top">
	Pro desktop aplikaci použít (okraje): 
	<body class="desktop">
	-->
	<body class="desktop sqcodeeditor" ng-app="app" style="font-family: {{$root.font}}'Open Sans', Arial, Helvetica, Sans-Serif; zoom: {{$root.zoom.css}};" class="{{$root.zoom.class}} {{$root.brEdition}}">
		<preload-templates></preload-templates>
		
		<div ui-view="main" style="height:100px"></div>

		<script>
			window.appConfig = {
				product: 'SQEDITOR',
				productName: 'CodeEditor',
				defaultState: 'editor',
				defaultURL: '/editor',
				gridSkin: 'dhx_web',
				gridImagePath: '../img/dhtmlx/web/'
			};
		</script>

	</body>
