name: Release qualification
on: [push, pull_request, workflow_dispatch]
jobs:
  ownership-removal:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix app/web ci
      - run: node app/web/node_modules/@playwright/test/cli.js install chrome
      - run: uv run python scripts/ci_check.py 2>&1 | Tee-Object -FilePath qualification.log
      - run: npm --prefix app/web run test:ui -- ui-migration-parity.spec.ts --grep "saved Builder|shell geometry" --workers=1 --timeout=60000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-evidence
          path: |
            qualification.log
            app/web/test-results/
