name: Release qualification
on: [push, pull_request, workflow_dispatch]
jobs:
  ownership-removal:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix app/ui ci
      - run: node app/ui/node_modules/@playwright/test/cli.js install chrome
      - run: uv run python scripts/release_check.py --report .agents/logs/ci-release/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-evidence
          path: .agents/logs/ci-release/
