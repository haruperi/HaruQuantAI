name: Release qualification
on: [push, pull_request, workflow_dispatch]
jobs:
  ownership-removal:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run --frozen ruff check app/host/logging tests/unit/test_telemetry_logging.py
      - run: uv run --frozen ruff format --check app/host/logging tests/unit/test_telemetry_logging.py
      - run: uv run --frozen mypy --explicit-package-bases app/host/logging
      - run: uv run --frozen pytest tests/unit/test_telemetry_logging.py --no-cov
      - run: uv run --frozen python -m app.host.logging --verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: uv run --frozen python scripts/ci_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qualification-evidence
          path: .agents/logs/
