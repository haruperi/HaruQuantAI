name: Feature Removability Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: removability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  removability-matrix:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run physical deletion and removability verification
        run: >-
          uv run --frozen python scripts/verify_feature_removal.py
          --all --report removability-report.json

      - name: Upload removability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: removability-report
          path: removability-report.json
          if-no-files-found: error
