name: Provider Removability Verification

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  removability-matrix:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run physical deletion and reinstall matrix
        run: uv run python scripts/architecture/provider_deletion_matrix.py --all --reinstall --report removability-report.json


      - name: Upload removability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: removability-report
          path: removability-report.json
