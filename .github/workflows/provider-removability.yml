name: Feature Removability Verification

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  removability-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        feature_id:
          - FEAT-BROKER-FEED_MOCK
          - FEAT-DATA-RETRIEVE_BARS
          - FEAT-SYS-PERSIST_STORAGE
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Verify physical feature removal
        run: uv run --frozen python scripts/verify_feature_removal.py ${{ matrix.feature_id }}
