name: Finalize Composability Plan Record

on:
  push:
    branches: [fix/final-composability-audit]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-composability-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-plan:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-composability-audit
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Finalize completed plan record
        run: uv run --frozen python scripts/_finalize_composability_plan.py

      - name: Commit completed plan
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/composability_gap_remediation_plan.md
          git commit -m "docs(plan): record completed and verified remediation"
          git push origin HEAD:fix/final-composability-audit
