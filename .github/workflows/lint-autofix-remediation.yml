name: Lint Autofix Remediation Branch

on:
  push:
    branches: [fix/final-composability-audit]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lint-autofix-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-autofix:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-composability-audit
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply Ruff lint fixes and formatting
        shell: pwsh
        run: |
          uv run --frozen ruff check --fix --unsafe-fixes .
          uv run --frozen ruff format .

      - name: Commit lint cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host "No auto-fixable lint changes required."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff lint cleanup to remediation changes"
          git push origin HEAD:fix/final-composability-audit
