minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - pre-push

exclude: ^\.agents/task/

repos:
  # Repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]

      - id: end-of-file-fixer
        # Use the pinned module without a generated Windows executable launcher.
        entry: python -m pre_commit_hooks.end_of_file_fixer
        stages: [pre-commit]

      - id: check-yaml
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

      - id: check-json
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: check-case-conflict
        stages: [pre-commit]

      - id: check-added-large-files
        args: ["--maxkb=25000"]
        stages: [pre-commit]

      - id: debug-statements
        entry: python -m pre_commit_hooks.debug_statement_hook
        stages: [pre-commit]

  # Project development tools
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: qualification-check
        name: Authoritative pre-push qualification
        entry: uv run python scripts/ci_check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
