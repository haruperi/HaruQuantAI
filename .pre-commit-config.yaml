minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - pre-push

exclude: ^\.agents/task/

repos:
  # Repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: check-yaml
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

      - id: check-json
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: check-case-conflict
        stages: [pre-commit]

      - id: check-added-large-files
        args: ["--maxkb=25000"]
        stages: [pre-commit]

      - id: debug-statements
        stages: [pre-commit]

  # Project development tools
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: affected-validation
        name: Affected pre-push validation
        entry: uv run --locked python scripts/ci_check.py --profile affected --base origin/main --head HEAD
        language: system
        pass_filenames: false
        files: ^(app/|tests/|scripts/|\.agents/|\.github/workflows/|docs/templates/prompt/|AGENTS\.md$|\.pre-commit-config\.yaml$|pyproject\.toml$|uv\.lock$)
        stages: [pre-push]

  # Secret detection runs after formatting so it scans the exact final bytes.
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets without mutating the tracked baseline
        entry: uv run --locked python scripts/detect_secrets_filters.py --baseline .github/.secrets.baseline
        language: system
        exclude: \.secrets\.baseline$
        stages: [pre-commit]
