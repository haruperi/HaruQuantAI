prompt_schema_version = 1

[task_workspace]
planner_journal = ".agents/task/planner.md"
executor_journal = ".agents/task/executor.md"
reviewer_journal = ".agents/task/reviewer.md"
next_agent = ".agents/task/next-agent.md"

[isolation]
solo = "shared-current-ide-chat-soft-cross-role"
solo-headless = "shared-native-cli-session-soft-cross-role"
delegate = "dedicated-inspectable-app-agent-per-role"
delegate-headless = "dedicated-native-cli-session-per-role"
delegate-multi = "dedicated-multi-vendor-native-cli-session-per-role"
manual = "dedicated-role-chat"
quick-fix = "same-current-ide-chat-direct-main"

[session_continuity]
scope = "workflow-run"
same_role_resume = true
new_run_new_sessions = true
reviewer_closeout_reuses_reviewer = true
session_context_is_authority = false
recovery_uses_fresh_generation = true
recovery_generation_limit = 1

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "TASK_ACTIVATED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "QUICK_FIX_ACTIVATED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/quick-fix-planner.md"

[[transitions]]
source_role = "PLANNER"
handoff = "QUICK_FIX_PENDING_APPROVAL"
target_role = "EXECUTOR"
gate = "APPROVED: EXECUTE"
target_template = "docs/templates/prompt/quick-fix-executor.md"

[[transitions]]
source_role = "EXECUTOR"
handoff = "QUICK_FIX_COMPLETE"
target_role = "NONE"

[[transitions]]
source_role = "PLANNER"
handoff = "QUICK_FIX_BLOCKED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/quick-fix-planner.md"

[[transitions]]
source_role = "EXECUTOR"
handoff = "QUICK_FIX_BLOCKED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/quick-fix-planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "QUICK_FIX_OWNER_REJECTED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/quick-fix-planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "QUICK_FIX_BLOCKER_RESOLVED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/quick-fix-planner.md"

[[transitions]]
source_role = "PLANNER"
handoff = "PENDING_APPROVAL"
target_role = "EXECUTOR"
gate = "APPROVED: EXECUTE"
target_template = "docs/templates/prompt/executor.md"

[[transitions]]
source_role = "PLANNER"
handoff = "BLOCKED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "EXECUTOR"
handoff = "READY_FOR_REVIEW"
target_role = "REVIEWER"
target_template = "docs/templates/prompt/reviewer.md"

[[transitions]]
source_role = "EXECUTOR"
handoff = "BLOCKED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "REVIEWER"
handoff = "CHANGES_REQUESTED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "REVIEWER"
handoff = "PENDING_COMMIT"
target_role = "REVIEWER"
gate = "APPROVED: COMMIT"
target_template = "docs/templates/prompt/reviewer-closeout.md"

[[transitions]]
source_role = "REVIEWER"
handoff = "ACCEPTED"
target_role = "NONE"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "OWNER_REJECTED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "COMMIT_REJECTED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "BLOCKER_RESOLVED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "SCOPE_BLOCKED"
target_role = "PLANNER"
target_template = "docs/templates/prompt/planner.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "EXECUTOR_HANDOFF_CORRECTION"
target_role = "EXECUTOR"
target_template = "docs/templates/prompt/executor.md"

[[transitions]]
source_role = "ORCHESTRATOR"
handoff = "REVIEWER_HANDOFF_CORRECTION"
target_role = "REVIEWER"
target_template = "docs/templates/prompt/reviewer.md"
