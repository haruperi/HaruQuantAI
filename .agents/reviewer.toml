# Reviewer agent — Cline CLI with Z.ai GLM-5.3 (high reasoning).
#
# Provider id `zai-coding-plan` is the Z.ai provider already configured in
# your Cline setup (~/.cline). Do NOT add cline's `-p` flag: in Cline it means
# PLAN mode, and the Reviewer must run in act mode to rerun tests and perform
# the accepted close-out (journal cleanup, task commit, ff-only merge).
# Cline one-shot mode enables tool auto-approve by default.

brand = "cline"
command = ["cline", "-P", "zai-coding-plan", "-m", "glm-5.3", "--thinking", "high"]
prompt_delivery = "file"          # file | arg | stdin
template = ".agents/templates/reviewer.md"
