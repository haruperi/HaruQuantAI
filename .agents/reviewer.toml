# Reviewer agent — persistent same-role Cline session per workflow run.
brand = "cline"
session_adapter = "cline"
session_continuity = "required"
provider = "zai-coding-plan"
model = "glm-5.3"
effort = "xhigh"
command = ["python", ".agents/session_runner.py", "--brand", "cline", "--role", "reviewer", "--provider", "zai-coding-plan", "--model", "glm-5.3", "--effort", "xhigh", "{prompt}"]
prompt_delivery = "file"
template = "docs/templates/prompt/reviewer.md"
