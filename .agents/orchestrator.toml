# HaruQuantAI artifact-driven agent orchestrator wiring.

[run]
repo_path = 'C:\\Users\\rharu\\AppDev\\HaruquantAI'
main_branch = "main"
max_iterations = 5
invocation_timeout_seconds = 7200
stream_agent_output = true
stream_heartbeat_seconds = 60
agent_retry_attempts = 1

[paths]
protocol = ".agents/protocol.toml"
logs_dir = ".agents/logs"
runs_dir = ".agents/runs"

[roles]
planner = "planner.toml"
executor = "executor.toml"
reviewer = "reviewer.toml"
