# HaruQuantAI — Research Profile Configuration (Example)
# Offline research and dataset preparation

[application]
profile = "research"

[features.FEAT-SYS-PROVIDE_CLOCK]
enabled = true

[features.FEAT-BROKER-FEED_MOCK]
enabled = true

[features.FEAT-DATA-RETRIEVE_BARS]
enabled = true

[features.FEAT-DATA-RETRIEVE_BARS.config]
default_timeframe = "M1"
cache_enabled = false
