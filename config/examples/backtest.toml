# HaruQuantAI — Backtest Profile Configuration (Example)
# Historical simulation and strategy validation

[application]
profile = "backtest"

[features.FEAT-SYS-PROVIDE_CLOCK]
enabled = true

[features.FEAT-BROKER-FEED_MOCK]
enabled = true

[features.FEAT-DATA-RETRIEVE_BARS]
enabled = true

[features.FEAT-DATA-RETRIEVE_BARS.config]
default_timeframe = "M1"
