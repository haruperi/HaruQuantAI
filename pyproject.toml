[project]
name = "haruquantai"
version = "2.2.11"
description = "Quantitative Financial Trading System"
readme = "README.md"
authors = [
    { name = "Haruperi", email = "r.haruperi@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ctrader-open-api>=0.9.2",
    "fastapi>=0.115.0",
    "metatrader5>=5.0.5735 ; sys_platform == 'win32'",
    "numba>=0.65.1",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyarrow",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2",
    "pyyaml==6.0.3",
    "python-binance>=1.0.37",
    "scikit-learn==1.9.0",
    "service-identity>=24.2.0",
    # Pinned to the exact version `ctrader-open-api==0.9.2` requires. Brokers
    # imports `twisted.internet` directly in `ctrader/network.py`, so NFR-BRK-013
    # requires this transitive package to be declared rather than inherited.
    "twisted==24.3.0",
    "uvicorn>=0.30.0",
    "yfinance>=1.4.1",
    "exchange-calendars==4.12",
    # Agentic FEAT-AGT-03 runtime. Reachable only through the HaruQuantAI-owned
    # `AdkRuntime` port in `app/agentic/runtime/adk.py`; no ADK object crosses
    # the Agentic public boundary. Requires the `requests` override below.
    "google-adk>=2.5.0",
    "tqdm>=4.70.0",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
]

[project.scripts]
haruquantai = "app.main:run"

[project.entry-points."haruquantai.features"]
brokers-binance = "app.services.brokers.binance.feature:feature"
brokers-ctrader = "app.services.brokers.ctrader.feature:feature"
brokers-dukascopy = "app.services.brokers.dukascopy.feature:feature"
brokers-metatrader = "app.services.brokers.metatrader.feature:feature"
brokers-resolve = "app.services.brokers.resolve.feature:feature"
brokers-yahoo = "app.services.brokers.yahoo.feature:feature"
catalogue-instrument-catalogue = "app.services.catalogue.instrument_catalogue.feature:feature"
catalogue-provider-mapping = "app.services.catalogue.provider_mapping.feature:feature"
catalogue-session-calendar = "app.services.catalogue.session_calendar.feature:feature"
data-bar-aggregation = "app.services.data.bar_aggregation.feature:feature"
data-connector-synchronization = "app.services.data.connector_synchronization.feature:feature"
data-data-inspection-retention = "app.services.data.data_inspection_retention.feature:feature"
data-data-quality-resolution = "app.services.data.data_quality_resolution.feature:feature"
data-economic-news-evidence = "app.services.data.economic_news_evidence.feature:feature"
data-external-indicator-series = "app.services.data.external_indicator_series.feature:feature"
data-external-series-alignment = "app.services.data.external_series_alignment.feature:feature"
data-historical-data-ingestion = "app.services.data.historical_data_ingestion.feature:feature"
data-market-data-store = "app.services.data.market_data_store.feature:feature"
data-profile-source-preparation = "app.services.data.profile_source_preparation.feature:feature"
data-quantdata-manager-source = "app.services.data.quantdata_manager_source.feature:feature"
data-realtime-market-events = "app.services.data.realtime_market_events.feature:feature"
data-run-data-binding = "app.services.data.run_data_binding.feature:feature"
data-synthetic-scenario-series = "app.services.data.synthetic_scenario_series.feature:feature"
data-tick-normalization = "app.services.data.tick_normalization.feature:feature"
workspace-manage-accounts = "app.services.workspace.manage_accounts.feature:feature"
workspace-manage-workspaces = "app.services.workspace.manage_workspaces.feature:feature"
workspace-execute-persistence = "app.services.workspace.execute_persistence.feature:feature"
workspace-manage-watchlists = "app.services.workspace.manage_watchlists.feature:feature"
workspace-administer-settings = "app.services.workspace.administer_settings.feature:feature"
workspace-secure-local-access = "app.services.workspace.secure_local_access.feature:feature"
workspace-manage-artifacts = "app.services.workspace.manage_artifacts.feature:feature"
workspace-build-diagnostics = "app.services.workspace.build_diagnostics.feature:feature"
interfaces-serve-api-events = "app.services.interfaces.serve_api_events.feature:feature"
interfaces-observe-market-data = "app.services.interfaces.observe_market_data.feature:feature"
interfaces-observe-market-catalogue = "app.services.interfaces.observe_market_catalogue.feature:feature"
interfaces-operate-identity = "app.services.interfaces.operate_identity.feature:feature"
interfaces-operate-settings = "app.services.interfaces.operate_settings.feature:feature"
interfaces-operate-jobs = "app.services.interfaces.operate_jobs.feature:feature"
interfaces-operate-watchlists = "app.services.interfaces.operate_watchlists.feature:feature"
interfaces-operate-trading = "app.services.interfaces.operate_trading.feature:feature"
interfaces-observe-market-reference = "app.services.interfaces.observe_market_reference.feature:feature"
trading-manage-execution-sessions = "app.services.trading.manage_execution_sessions.feature:feature"
data-browse-reference = "app.services.data.browse_reference.feature:feature"
orchestration-manage-jobs = "app.services.orchestration.manage_jobs.feature:feature"
orchestration-deliver-notifications = "app.services.orchestration.deliver_notifications.feature:feature"
orchestration-reserve-resources = "app.services.orchestration.reserve_resources.feature:feature"
orchestration-execute-local-work = "app.services.orchestration.execute_local_work.feature:feature"
plugins-declare-manifests = "app.services.plugins.declare_manifests.feature:feature"
plugins-register-contributions = "app.services.plugins.register_contributions.feature:feature"
agentic-enforce-mandate = "app.services.agentic.enforce_mandate.feature:feature"
agentic-operate-runs = "app.services.agentic.operate_runs.feature:feature"
agentic-register-roles = "app.services.agentic.register_roles.feature:feature"
agentic-govern-tool-calls = "app.services.agentic.govern_tool_calls.feature:feature"
agentic-invoke-models = "app.services.agentic.invoke_models.feature:feature"


# ============================================================================
# Ruff Configuration (Formatting, Linting, Import Sorting, Security, Complexity)
# ============================================================================
[tool.ruff]
target-version = "py314"
line-length = 88
cache-dir = ".dev/.ruff_cache"
src = ["app", "tests", ".agents"]
extend-exclude = [
    ".dev",
    "docs",
    "htmlcov",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true

select = [
    "F", "E", "W", "C90", "I", "N", "D", "UP", "YTT", "ASYNC", "S",
    "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM",
    "EXE", "FA", "ISC", "ICN", "LOG", "G", "INP", "PIE", "PYI", "PT",
    "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TC", "INT", "ARG",
    "PTH", "TD", "FIX", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "FAST",
    "AIR", "PERF", "FURB", "RUF", "ANN", "D420", "DOC102", "DOC201",
    "DOC202", "DOC402", "DOC403", "DOC501",
]

ignore = [
    "FBT003", "D203", "D212", "D400", "D401", "D415", "S311", "PERF401",
    "RET504", "FA102", "TRY003", "EM101", "TC002", "TC003", "UP047",
    "COM812", "ISC001", "PLC0415", "PLR0913", "FBT001", "FBT002", "D107",
    "TRY300",
]

