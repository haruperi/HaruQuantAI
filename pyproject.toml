[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["ignore:.*utcfromtimestamp.*"]
addopts = [
    "-o", "cache_dir=.dev/.pytest_cache",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--import-mode=importlib",
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
data_file = ".dev/.coverage"
source = ["app"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.html]
directory = ".dev/htmlcov"

[tool.mypy]
python_version = "3.14"
files = ["app", "tests", ".agents"]
strict = true
mypy_path = [".", ".agents"]
cache_dir = ".dev/.mypy_cache"
warn_unreachable = true
strict_equality_for_none = true
enable_error_code = [
    "deprecated", "explicit-override", "ignore-without-code", "mutable-override",
    "truthy-bool", "truthy-iterable", "unimported-reveal",
]
pretty = true
show_error_context = true
show_error_end = true
show_error_code_links = true
exclude = [
    "^scripts/",
    '(^|/)(\.dev|build|dist)(/|$)',
    '(^|/)(generated|vendor|migrations)(/|$)',
    '(^|/)tests/.*/providers(/|$)',
    '(^|/)\.agents/worktrees(/|$)',
]
warn_unused_configs = false
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "app.services.data.market_data_store.*"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "pandas", "yfinance", "binance.*", "requests", "pytest_mock", "MetaTrader5",
    "yaml", "sklearn.*", "scipy.*", "sklearn", "scipy", "ctrader",
    "ctrader_open_api", "ctrader_open_api.*", "twisted", "twisted.*", "numba",
    "numba.*", "service_identity", "pyarrow", "pyarrow.*", "duckdb", "duckdb.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.18",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
override-dependencies = ["requests>=2.32.4"]

[tool.haruquantai.schema]
version = 1
description = "Interdomain and runtime profile capability dependency manifest"

[tool.haruquantai.domain.brokers]
description = "Direct passthrough connectivity to broker and market-data platforms"
required_capabilities = ["utils.time@1"]
optional_capabilities = ["utils.logging@1"]

[tool.haruquantai.domain.data]
description = "Acquisition, normalization, historical storage, and real-time streaming"
required_capabilities = ["broker.instruments@1", "data.persistence@1", "utils.time@1"]
optional_capabilities = [
    "data.bar-cache@1", "broker.mt5.channel@1", "broker.ctrader.channel@1",
    "broker.binance.channel@1", "utils.logging@1", "utils.random_streams@1",
]

[tool.haruquantai.domain.indicators]
description = "Deterministic pure-function technical and statistical indicator calculations"
required_capabilities = ["data.market-data@1", "indicator.registry@1"]
optional_capabilities = ["utils.logging@1"]

[tool.haruquantai.domain.strategy]
description = "Signal generation, trade intent formulation, and playbook evaluation"
required_capabilities = ["data.market-data@1", "strategy.registry@1"]
optional_capabilities = [
    "indicator.trend@1", "indicator.momentum@1", "indicator.volatility@1",
    "data.tick_stream@1", "data.replay-packages@1", "utils.logging@1",
]

[tool.haruquantai.domain.risk]
description = "Master safety gate: exposure evaluation, sizing, drawdown guard, and kill switches"
required_capabilities = ["risk.contracts@1", "risk.profiles@1"]
optional_capabilities = ["data.market-data@1", "risk.portfolio-snapshot@1", "utils.logging@1"]

[tool.haruquantai.domain.trading]
description = "Live and demo order intent execution, reconciliation, and active position tracking"
required_capabilities = [
    "trading.contracts@1", "trading.state@1", "risk.proposal-gate@1",
    "risk.approval-tokens@1", "risk.kill-switch@1", "broker.mt5.channel@1",
]
optional_capabilities = [
    "broker.ctrader.channel@1", "broker.binance.channel@1",
    "trading.protective-orders@1", "notification.delivery@1", "utils.logging@1",
]

[tool.haruquantai.domain.simulator]
description = "Deterministic historical backtesting and execution realism engine"
required_capabilities = ["data.market-data@1", "strategy.vectorized@1", "simulator.timeline@1"]
optional_capabilities = [
    "risk.proposal-gate@1", "broker.sim.channel@1", "simulator.realism@1",
    "simulator.recovery@1", "utils.logging@1",
]

[tool.haruquantai.domain.analytics]
description = "Read-only performance measurement, return metrics, and trade journal analysis"
required_capabilities = ["analytics.contracts@1"]
optional_capabilities = [
    "data.market-data@1", "analytics.metrics@1", "analytics.drawdown@1", "utils.logging@1",
]

[tool.haruquantai.domain.optimization]
description = "Parameter space search, objective scoring, and walk-forward validation"
required_capabilities = [
    "strategy.parameters@1", "simulator.backtest@1", "analytics.metrics@1",
]
optional_capabilities = [
    "optimization.walk-forward@1", "optimization.monte-carlo@1",
    "utils.random_streams@1", "utils.logging@1",
]

[tool.haruquantai.domain.research]
description = "Sandboxed alpha factor discovery, hypothesis testing, and regime modeling"
required_capabilities = ["data.market-data@1", "research.data@1"]
optional_capabilities = [
    "indicator.registry@1", "analytics.metrics@1", "data.research-docs@1",
    "data.calendar@1", "utils.logging@1",
]

[tool.haruquantai.domain.portfolio]
description = "Multi-strategy portfolio construction, risk-budgeting, and rebalancing"
required_capabilities = ["portfolio.contracts@1", "data.persistence@1"]
optional_capabilities = [
    "analytics.metrics@1", "risk.portfolio-snapshot@1", "simulator.multi-asset@1",
    "trading.dispatch@1", "utils.logging@1",
]

[tool.haruquantai.domain.agentic]
description = "Governed multi-agent firm: specialized research, coding, and deliberation"
required_capabilities = ["agentic.contracts@1", "data.market-data@1"]
optional_capabilities = [
    "research.edge-studies@1", "strategy.vectorized@1", "analytics.reports@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.api]
description = "FastAPI workstation composition gateway exposing HTTP and SSE boundaries"
required_capabilities = ["api.catalog@1", "api.identity@1", "data.persistence@1", "utils.responses@1"]
optional_capabilities = [
    "data.market-data@1", "data.tick_stream@1", "indicator.registry@1",
    "strategy.registry@1", "risk.proposal-gate@1", "risk.kill-switch@1",
    "trading.dispatch@1", "trading.state@1", "simulator.backtest@1",
    "simulator.workbench@1", "analytics.reports@1", "optimization.search@1",
    "research.edge-studies@1", "portfolio.activation@1", "agentic.operations@1",
    "utils.logging@1",
]

[tool.haruquantai.profile.research]
description = "Offline exploratory data analysis, hypothesis testing, and feature engineering"
required_capabilities = ["data.market-data@1", "research.data@1", "indicator.registry@1"]

[tool.haruquantai.profile.simulation]
description = "Deterministic historical backtesting and parameter optimization"
required_capabilities = [
    "data.market-data@1", "strategy.vectorized@1", "simulator.timeline@1",
    "simulator.backtest@1", "analytics.metrics@1",
]

[tool.haruquantai.profile.demo]
description = "Paper trading and broker demo account execution with risk governance"
required_capabilities = [
    "broker.instruments@1", "broker.mt5.channel@1", "data.tick_stream@1",
    "strategy.event@1", "risk.proposal-gate@1", "risk.approval-tokens@1",
    "risk.kill-switch@1", "trading.state@1", "trading.dispatch@1",
]

[tool.haruquantai.profile.live]
description = "Live real-money market execution under strict risk governance and kill-switch hierarchy"
required_capabilities = [
    "broker.instruments@1", "broker.mt5.channel@1", "data.tick_stream@1",
    "strategy.event@1", "risk.proposal-gate@1", "risk.approval-tokens@1",
    "risk.drawdown-guard@1", "risk.kill-switch@1", "trading.state@1",
    "trading.dispatch@1", "trading.reconciliation@1",
]
