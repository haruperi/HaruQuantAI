[project]
name = "haruquantai"
version = "2.2.11"
description = "Quantitative Financial Trading System"
readme = "README.md"
authors = [
    { name = "Haruperi", email = "r.haruperi@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ctrader-open-api>=0.9.2",
    "fastapi>=0.115.0",
    "metatrader5>=5.0.5735 ; sys_platform == 'win32'",
    "numba>=0.65.1",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyarrow",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2",
    "pyyaml==6.0.3",
    "python-binance>=1.0.37",
    "scikit-learn==1.9.0",
    "service-identity>=24.2.0",
    # Pinned to the exact version `ctrader-open-api==0.9.2` requires. Brokers
    # imports `twisted.internet` directly in `ctrader/network.py`, so NFR-BRK-013
    # requires this transitive package to be declared rather than inherited.
    "twisted==24.3.0",
    "uvicorn>=0.30.0",
    "yfinance>=1.4.1",
    "exchange-calendars==4.12",
    # Agentic FEAT-AGT-03 runtime. Reachable only through the HaruQuantAI-owned
    # `AdkRuntime` port in `app/agentic/runtime/adk.py`; no ADK object crosses
    # the Agentic public boundary. Requires the `requests` override below.
    "google-adk>=2.5.0",
    "tqdm>=4.70.0",
    "httpx>=0.28.1",
    "openai>=3.3.1",
]

[project.scripts]
haruquantai = "app.main:run"

[project.entry-points."haruquantai.features"]
brokers-binance = "app.services.brokers.binance.feature:feature"
brokers-ctrader = "app.services.brokers.ctrader.feature:feature"
brokers-dukascopy = "app.services.brokers.dukascopy.feature:feature"
brokers-metatrader = "app.services.brokers.metatrader.feature:feature"
brokers-resolve = "app.services.brokers.resolve.feature:feature"
brokers-yahoo = "app.services.brokers.yahoo.feature:feature"
catalogue-instrument-catalogue = "app.services.catalogue.instrument_catalogue.feature:feature"
catalogue-provider-mapping = "app.services.catalogue.provider_mapping.feature:feature"
catalogue-session-calendar = "app.services.catalogue.session_calendar.feature:feature"
data-bar-aggregation = "app.services.data.bar_aggregation.feature:feature"
data-connector-synchronization = "app.services.data.connector_synchronization.feature:feature"
data-data-inspection-retention = "app.services.data.data_inspection_retention.feature:feature"
data-data-quality-resolution = "app.services.data.data_quality_resolution.feature:feature"
data-economic-news-evidence = "app.services.data.economic_news_evidence.feature:feature"
data-external-indicator-series = "app.services.data.external_indicator_series.feature:feature"
data-external-series-alignment = "app.services.data.external_series_alignment.feature:feature"
data-historical-data-ingestion = "app.services.data.historical_data_ingestion.feature:feature"
data-profile-source-preparation = "app.services.data.profile_source_preparation.feature:feature"
data-quantdata-manager-source = "app.services.data.quantdata_manager_source.feature:feature"
data-realtime-market-events = "app.services.data.realtime_market_events.feature:feature"
data-run-data-binding = "app.services.data.run_data_binding.feature:feature"
data-synthetic-scenario-series = "app.services.data.synthetic_scenario_series.feature:feature"
data-tick-normalization = "app.services.data.tick_normalization.feature:feature"
interfaces-serve-api-events = "app.services.interfaces.serve_api_events.feature:feature"

# ============================================================================
# Ruff Configuration (Formatting, Linting, Import Sorting, Security, Complexity)
# ============================================================================
[tool.ruff]
target-version = "py314"
line-length = 88
cache-dir = ".dev/.ruff_cache"
src = ["app", "tests", ".agents"]
extend-exclude = [
    ".dev",
    "docs",
    "htmlcov",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true

# 1. ENABLING ALL REQUESTED RULE GROUPS
select = [
    "F",     # Pyflakes – detects syntax errors and basic mistakes
    "E",     # Pycodestyle errors (style issues, including E501 line length)
    "W",     # Pycodestyle warnings (style issues)
    "C90",   # McCabe – complexity metric for functions
    "I",     # isort – import ordering checks
    "N",     # PEP8 Naming – naming conventions
    "D",     # Pydocstyle – docstring formatting (including D1 mandatory checks)
    "UP",    # Pyupgrade – upgrades syntax to newer Python versions
    "YTT",   # Flake8-2020 – checks for misuse of sys.version and sys.version_info
    "ASYNC", # Flake8-async – checks async/await usage
    "S",     # Flake8-bandit – security issues
    "BLE",   # Flake8-blind-except – flags bare excepts
    "FBT",   # Flake8-boolean-trap – potential pitfalls with booleans
    "B",     # Flake8-bugbear – common bug patterns
    "A",     # Flake8-builtins – misuse of Python built-in names
    "COM",   # Flake8-commas – trailing/comma issues
    "C4",    # Flake8-comprehensions – best practices in comprehensions
    "DTZ",   # Flake8-datetimez – requires timezone-aware datetime objects
    "T10",   # Flake8-debugger – debugger statements (e.g. pdb)
    "DJ",    # Flake8-django – Django-specific conventions
    "EM",    # Flake8-errmsg – error message style
    "EXE",   # Flake8-executable – executable file checks
    "FA",    # Flake8-future-annotations – future import for annotations
    "ISC",   # Flake8-implicit-str-concat – warns on implicit string concatenation
    "ICN",   # Flake8-import-conventions – enforces conventional import aliases
    "LOG",   # Flake8-logging – proper logging usage
    "G",     # Flake8-logging-format – logging format string issues
    "INP",   # Flake8-no-pep420 – requires __init__.py files
    "PIE",   # Flake8-pie – Python improvement suggestions
    "PYI",   # Flake8-pyi – checks for type stub (.pyi) consistency
    "PT",    # Flake8-pytest-style – pytest best practices
    "Q",     # Flake8-quotes – enforces quote style consistency
    "RSE",   # Flake8-raise – proper raise statement usage
    "RET",   # Flake8-return – return statement issues
    "SLF",   # Flake8-self – flags instance methods that don't use self
    "SLOT",  # Flake8-slots – suggests use of __slots__ where appropriate
    "SIM",   # Flake8-simplify – code simplification hints
    "TID",   # Flake8-tidy-imports – enforces specific import styles
    "TC",    # Flake8-type-checking – proper import of typing in type checks
    "INT",   # Flake8-gettext – checks for proper internationalization usage
    "ARG",   # Flake8-unused-arguments – flags unused function arguments
    "PTH",   # Flake8-use-pathlib – encourages pathlib over os.path
    "TD",    # Flake8-todos – flags TODO comments
    "FIX",   # Flake8-fixme – flags FIXME comments
    "PD",    # Pandas-vet – checks pandas-specific code practices
    "PGH",   # Pygrep-hooks – custom grep hooks for linting
    "PL",    # Pylint – integration with Pylint conventions
    "TRY",   # Tryceratops – try/except usage suggestions
    "FLY",   # Flynt – f-string conversion suggestions
    "NPY",   # NumPy-specific rules – ensures NumPy coding standards
    "FAST",  # FastAPI – FastAPI-specific linting rules
    "AIR",   # Airflow – Airflow-specific linting rules
    "PERF",  # Perflint – performance-related checks
    "FURB",  # Refurb – rules for code refurbishment
    "RUF",   # Ruff-specific rules – additional Ruff checks
    "ANN",   # Flake8-annotations - enforces type annotations
    "D420",   # Pydocstyle - enforce Google Args/Returns/Raises section order
    "DOC102", # Pydoclint - reject parameters absent from the signature
    "DOC201", # Pydoclint - require Returns for returned values
    "DOC202", # Pydoclint - reject Returns when no value is returned
    "DOC402", # Pydoclint - require Yields for generators
    "DOC403", # Pydoclint - reject Yields for non-generators
    "DOC501", # Pydoclint - document explicitly raised exceptions
]

# 2. CAREFULLY FILTERED IGNORE LIST (D1 and E501 removed from here so they run!)
ignore = [
    "FBT003",  # Flake8-boolean-trap - boolean position value in function call
    "D203",    # Pydocstyle - one blank line required before class docstring (conflicts with D211)
    "D212",    # Pydocstyle - summary line should be immediately after opening quotes (conflicts with D213)
    "D400",    # Pydocstyle - First line should end with a period
    "D401",    # Pydocstyle - First line should be in an imperative mood
    "D415",    # Pydocstyle - First line should end with a period, question mark, or exclamation point
    "S311",    # Flake8-bandit - Pseudo-random generators warning (fine for quant simulations, non-crypto)
    "PERF401", # Perflint - Checks for loops that can be replaced by a list comprehension
    "RET504",  # Flake8-return - Checks for unnecessary variable assignments right before a return
    "FA102",   # Flake8-future-annotations - Missing future annotations import but uses PEP 604
    "TRY003",  # Tryceratops - Checks for long exception messages outside exception class
    "EM101",   # Flake8-errmsg - Checks for string literals in exception constructors
    "TC002",   # Flake8-type-checking - Checks for typing imports outside TYPE_CHECKING blocks
    "TC003",   # Flake8-type-checking - Checks for imports from typing outside TYPE_CHECKING blocks
    "UP047",   # Pyupgrade - PEP 695 generic functions are not supported by pinned mypy/pre-commit yet
    "COM812",  # Flake8-commas - Formatter conflicts
    "ISC001",  # Flake8-implicit-str-concat - Formatter conflicts
    "PLC0415", # Pylint - deferred imports allowed for lazy-loading optional dependencies
    "PLR0913", # Pylint - too many arguments in function definition (6 > 5) standard for API/Broker functions
    "FBT001",  # Flake8-boolean-trap - boolean-typed positional argument in function definition (standard format selectors)
    "FBT002",  # Flake8-boolean-trap - boolean default positional argument in function definition
    "D107",    # Pydocstyle - Missing docstring in __init__
    "TRY300",  # Tryceratops - Consider moving statement to an else block
]

[tool.ruff.lint.per-file-ignores]
# The SQX JIT decoders repeat per-field width branches by design.
"app/services/data/sqx_source/reader.py" = ["PLR2004", "C901", "PLR0912", "PLR0915"]
# Rules to ignore only within test environments
"test_*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "PLC0415", "EM102", "ANN", "E501"]
"*_test.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "PLC0415", "EM102", "ANN", "E501"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "ARG005", "PLC0415", "EM102", "ANN", "E501"]
"conftest.py" = ["S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "ARG005", "PLC0415", "EM102", "ANN", "E501"]
"tests/*/usage/*.py" = ["N999", "S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "ARG005", "PLC0415", "EM102", "ANN", "INP001", "E501"]
"tests/*/usage/**/*.py" = ["N999", "S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "ARG005", "PLC0415", "EM102", "ANN", "INP001", "E501"]
"tests/legacy/*.py" = ["N999", "S101", "S105", "S106", "S107", "PLR2004", "SLF001", "D", "DOC", "ARG001", "ARG005", "PLC0415", "EM102", "ANN", "INP001", "E501", "E402"]
"tests/research/**/*.py" = ["INP001"]
"app/services/data/**/*.py" = ["DOC201", "DOC501"]
"app/services/data/**/_usage.py" = ["S101", "PT018", "TC001", "TC002", "TC003", "E501"]
"app/services/brokers/**/*.py" = ["DOC201", "DOC501", "C901", "PLR0912", "PLR0915", "TC001", "EM102", "E501", "FURB", "ANN401", "ARG002", "PLR2004", "BLE001", "TRY004", "ARG005", "TRY400", "E731", "RUF013", "D", "DOC", "ANN", "E402", "SLF001", "F401", "F841", "F821", "RUF012"]
"app/contracts/broker/**/*.py" = ["DOC201", "DOC501", "C901", "PLR0912", "PLR0915", "TC001", "EM102", "E501", "FURB", "ANN401", "ARG002", "PLR2004", "BLE001", "TRY004", "ARG005", "TRY400", "E731", "RUF013", "D", "DOC", "ANN", "E402", "SLF001", "F401", "F841", "F821", "RUF012", "UP007", "UP046", "UP047", "F403", "F405"]
"app/kernel/**/*.py" = ["C901", "PLR0912", "PLR0915", "TC001", "EM102", "DOC201", "DOC501", "E501", "FURB", "ANN401", "ARG002", "PLR2004", "BLE001", "TRY004"]
"app/composition/**/*.py" = ["C901", "PLR0912", "PLR0915", "TC001", "EM102", "DOC201", "DOC501", "E501", "FURB", "ANN401", "ARG002", "PLR2004", "BLE001", "TRY004", "ARG005", "TRY400"]
"app/utils/logging/__init__.py" = ["A005"]
"app/utils/time/__init__.py" = ["A005"]
"scripts/*.py" = ["INP001", "D100", "D103", "ANN", "S603", "S607", "T201"]
"docs/**/*.py" = ["INP001", "D", "DOC", "E501", "EM101", "EM102", "TRY003", "UP042", "C901"]
".agents/**/*.py" = ["INP001", "D", "DOC", "E501", "EM101", "EM102", "TRY003", "S603", "S607", "T201", "ANN", "C901", "PLR0912", "PLR0915", "PLR2004", "PT", "SLF001", "ARG001", "ARG005", "F403", "F405", "SIM", "PYI034", "S105", "RUF005"]
".agents/*.py" = ["INP001", "D", "DOC", "E501", "EM101", "EM102", "TRY003", "S603", "S607", "T201", "ANN", "C901", "PLR0912", "PLR0915", "PLR2004", "F403", "F405", "SIM", "PT", "PYI034", "S105", "RUF005"]

[tool.ruff.lint.mccabe]
# Standard strict function complexity ceiling
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Standard docstring styling format
convention = "google"

[tool.ruff.lint.pydoclint]
# Never exempt a docstring merely because it fits on one physical line.
ignore-one-line-docstrings = false

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = [
    "test_*.py",
    "*_test.py",
]
filterwarnings = [
    "ignore:.*utcfromtimestamp.*",
]
addopts = [
    "-o", "cache_dir=.dev/.pytest_cache",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--import-mode=importlib",
    "-ra",
    "--strict-markers",
    "--strict-config",
]

# ============================================================================
# Coverage Configuration (80% minimum, fail command on under 80%)
# ============================================================================
[tool.coverage.run]
data_file = ".dev/.coverage"
source = ["app"]
branch = true
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.html]
directory = ".dev/htmlcov"


# ============================================================================
# Mypy Strict Typing Configuration
# ============================================================================
[tool.mypy]
# Set this to the minimum Python version supported by the project.
python_version = "3.14"

# First-party code checked when running: python -m mypy
files = ["app", "tests", ".agents"]

# Main strictness policy
strict = true
mypy_path = "."
cache_dir = ".dev/.mypy_cache"

# Useful checks not included by strict
warn_unreachable = true
strict_equality_for_none = true

# Additional targeted checks
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
]

# Diagnostic output
pretty = true
show_error_context = true
show_error_end = true
show_error_code_links = true

# Only paths that may appear inside the checked source trees
exclude = [
    "^scripts/",
    '(^|/)(\.dev|build|dist)(/|$)',
    '(^|/)(generated|vendor|migrations)(/|$)',
    '(^|/)tests/.*/providers(/|$)',
]

warn_unused_configs = false
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "pandas",
    "yfinance",
    "binance.*",
    "requests",
    "pytest_mock",
    "MetaTrader5",
    "yaml",
    "sklearn.*",
    "scipy.*",
    "sklearn",
    "scipy",
    "ctrader",
    "ctrader_open_api",
    "ctrader_open_api.*",
    "twisted",
    "twisted.*",
    "numba",
    "numba.*",
    "service_identity"
]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[dependency-groups]
# Development and verification tooling. Excluded from the runtime
# dependency closure that Strategy records as `dependency_hash`, so a
# linter or test-plugin bump cannot invalidate strategy provenance.
dev = [
    "coverage>=7.14.2",
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.18",
]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

# `ctrader-open-api==0.9.2` pins `requests==2.32.3` exactly, and `google-adk`
# requires `requests>=2.32.4`; `ctrader-open-api==0.9.3` is yanked, so the two
# are otherwise unsatisfiable together.
#
# The override is safe for this project specifically: the only `requests` usage
# in `ctrader-open-api` is `Auth.getToken()` / `Auth.refreshToken()` in
# `auth.py`, and the Brokers cTrader adapter never calls either — it
# authenticates over protobuf/TCP with a caller-supplied `access_token`.
#
# Remove this override once `ctrader-open-api` relaxes its `requests` pin.
override-dependencies = ["requests>=2.32.4"]

# ============================================================================
# HaruQuantAI Domain & Profile Dependency Contract
# ============================================================================
#
# This section declares the authoritative interdomain and execution-profile
# capability dependencies for the HaruQuantAI microkernel architecture.
#
# Key Safety Invariant:
# Removing an optional provider (e.g. Research, Optimization, Simulator) does
# not impair other domains. Removing a mandatory safety gate (e.g. Risk)
# leaves non-trading services running, but deterministically BLOCKS every
# capability and profile (Demo, Live) that is unsafe without Risk.
# ============================================================================

[tool.haruquantai.schema]
version = 1
description = "Interdomain and runtime profile capability dependency manifest"

# ----------------------------------------------------------------------------
# 1. Domain Capability Dependencies
# ----------------------------------------------------------------------------

[tool.haruquantai.domain.brokers]
description = "Direct passthrough connectivity to broker and market-data platforms"
required_capabilities = [
    "utils.time@1",
]
optional_capabilities = [
    "utils.logging@1",
]

[tool.haruquantai.domain.data]
description = "Acquisition, normalization, historical storage, and real-time streaming"
required_capabilities = [
    "broker.instruments@1",
    "data.persistence@1",
    "utils.time@1",
]
optional_capabilities = [
    "data.bar-cache@1",
    "broker.mt5.channel@1",
    "broker.ctrader.channel@1",
    "broker.binance.channel@1",
    "utils.logging@1",
    "utils.random_streams@1",
]

[tool.haruquantai.domain.indicators]
description = "Deterministic pure-function technical and statistical indicator calculations"
required_capabilities = [
    "data.market-data@1",
    "indicator.registry@1",
]
optional_capabilities = [
    "utils.logging@1",
]

[tool.haruquantai.domain.strategy]
description = "Signal generation, trade intent formulation, and playbook evaluation"
required_capabilities = [
    "data.market-data@1",
    "strategy.registry@1",
]
optional_capabilities = [
    "indicator.trend@1",
    "indicator.momentum@1",
    "indicator.volatility@1",
    "data.tick_stream@1",
    "data.replay-packages@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.risk]
description = "Master safety gate: exposure evaluation, sizing, drawdown guard, and kill switches"
required_capabilities = [
    "risk.contracts@1",
    "risk.profiles@1",
]
optional_capabilities = [
    "data.market-data@1",
    "risk.portfolio-snapshot@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.trading]
description = "Live and demo order intent execution, reconciliation, and active position tracking"
required_capabilities = [
    "trading.contracts@1",
    "trading.state@1",
    "risk.proposal-gate@1",
    "risk.approval-tokens@1",
    "risk.kill-switch@1",
    "broker.mt5.channel@1",
]
optional_capabilities = [
    "broker.ctrader.channel@1",
    "broker.binance.channel@1",
    "trading.protective-orders@1",
    "notification.delivery@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.simulator]
description = "Deterministic historical backtesting and execution realism engine"
required_capabilities = [
    "data.market-data@1",
    "strategy.vectorized@1",
    "simulator.timeline@1",
]
optional_capabilities = [
    "risk.proposal-gate@1",
    "broker.sim.channel@1",
    "simulator.realism@1",
    "simulator.recovery@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.analytics]
description = "Read-only performance measurement, return metrics, and trade journal analysis"
required_capabilities = [
    "analytics.contracts@1",
]
optional_capabilities = [
    "data.market-data@1",
    "analytics.metrics@1",
    "analytics.drawdown@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.optimization]
description = "Parameter space search, objective scoring, and walk-forward validation"
required_capabilities = [
    "strategy.parameters@1",
    "simulator.backtest@1",
    "analytics.metrics@1",
]
optional_capabilities = [
    "optimization.walk-forward@1",
    "optimization.monte-carlo@1",
    "utils.random_streams@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.research]
description = "Sandboxed alpha factor discovery, hypothesis testing, and regime modeling"
required_capabilities = [
    "data.market-data@1",
    "research.data@1",
]
optional_capabilities = [
    "indicator.registry@1",
    "analytics.metrics@1",
    "data.research-docs@1",
    "data.calendar@1",
    "utils.logging@1",
]

[tool.haruquantai.domain.portfolio]
description = "Multi-strategy portfolio construction, risk-budgeting, and rebalancing"
required_capabilities = [
    "portfolio.contracts@1",
    "data.persistence@1",
